const BOOKS=[{"id": "tracy", "label": "BOOK 1", "name": "Tracy", "state": "CURRENT DRAFT", "ready": true, "facts": ["53", "Teacher", "Married", "Two children", "Coworkers", "21-year age gap"], "hook": "She has spent years becoming the person everyone can depend on. Then her younger coteacher starts listening closely enough that being competent stops feeling like the same thing as being seen.", "intro": ["Tracy has built a real adult life. Marriage, children, work, routines, responsibilities. She is good at what she does, and people trust her to keep things moving.", "Cliff is her younger coteacher: large, chaotic, funny, unexpectedly observant, and very good at giving other people the stage.", "Nothing dramatic happens at first. He listens. He remembers. He notices. Then Tracy starts noticing that she likes being noticed, and eventually that she has started looking back."], "signals": "Adult fiction · older woman / younger man · coworkers · marriage pressure · slow burn → high heat"}, {"id": "kristina", "label": "BOOK 2", "name": "Kristina", "state": "FULL SOURCE RECOVERED", "ready": false, "facts": ["Adult", "Teacher", "Sobriety pressure", "Sharp first-person voice"], "hook": "Kristina is very good at leaving first, joking first, and making sure nobody gets enough access to disappoint her. Unfortunately, Cliff keeps noticing the part she is trying to hide.", "intro": ["Kristina is funny when she is uncomfortable, sharp when she feels exposed, and more vulnerable than she wants anyone to notice.", "Her surviving draft already has its own engine: new-teacher strain, sobriety and relapse pressure, ghosting, resentment, jealousy around Tracy, and the humiliating problem of Cliff continuing to care after she has tried to disappear.", "A roughly 15,000-word full source survives. It has not yet been normalized into reader authority."], "signals": "Adult fiction · recovery themes · jealousy · emotional volatility · slow escalation → high heat"}, {"id": "alyssa", "label": "RECOVERED LANE", "name": "Alyssa", "state": "MANUSCRIPT HUNT", "ready": false, "facts": ["Adult", "Single mother", "Twins", "Nurse", "Former model", "Parent / teacher proximity"], "hook": "Her life is already full before Cliff enters it. The dangerous part is that he first becomes interesting by fitting naturally into the part of her life that is hardest to carry.", "intro": ["The pre-relationship fiction seed survives: a single mother of twins, a nurse and former model, watching one of her children attach strongly to Cliff at school.", "The attraction engine is different from Tracy's. Cliff is not first valuable because he makes her feel younger or more visible. He becomes difficult to ignore because she sees competence, warmth, and adult steadiness inside the chaos she already lives in.", "Later archive evidence proves an Alyssa story was written before the real relationship. The clean old manuscript has not yet been recovered, so this lane stays protected from later real-life history."], "signals": "Adult fiction · single mother · nurse · teacher/parent taboo · competence-as-attraction · high-heat direction"}, {"id": "mel", "label": "RECOVERED LANE", "name": "Mel", "state": "REVISED SOURCE RECOVERED", "ready": false, "facts": ["Adult", "Parent", "Military spouse", "Deployment pressure"], "hook": "Mel is already carrying the house, the family, and the waiting. Cliff becomes dangerous when helping her does not make her feel helpless.", "intro": ["Mel's strongest surviving source is a revised v8 manuscript of roughly 14,600 words.", "Her pressure is not Tracy's invisibility or Kristina's self-sabotage. It is competence under deployment, exhaustion, parenting, and the strange relief of being helped without being reduced to a problem that needs solving.", "The revised source still needs chronology and continuity review before becoming a reader book."], "signals": "Adult fiction · military spouse · parent life · deployment · exhaustion · forbidden relief"}, {"id": "pta", "label": "RECOVERED LANE", "name": "PTA Mom", "state": "LARGE SOURCE RECOVERED", "ready": false, "facts": ["Adult", "Parent", "Married", "PTA / school-community proximity"], "hook": "Nothing is catastrophically wrong with her life. That is exactly why feeling abruptly alive around Cliff is so inconvenient.", "intro": ["A roughly 23,900-word compilation survives for an unnamed PTA-mother POV.", "Her marriage is functioning and safe. Her life is contained rather than ruined. Cliff first registers by waking up a dead room, then becomes a private contrast to how predictable everything else has become.", "The surviving compilation contains duplicates and earlier parts inside it, so identity and chronology still need normalization."], "signals": "Adult fiction · PTA mom · functioning marriage · boredom/aliveness · parent/teacher taboo"}, {"id": "jordy", "label": "RECOVERED LANE", "name": "Jordy", "state": "MULTI-PART SOURCE RECOVERED", "ready": false, "facts": ["22", "New teacher", "Has a boyfriend", "Different school", "District orientation"], "hook": "Jordy is new, young, bright, and still half living in the momentum of college. Cliff is older enough to feel grounded without feeling old, which makes him a very different kind of problem.", "intro": ["Jordyn, usually Jordy, is explicitly twenty-two and meets Cliff at district new-teacher orientation rather than in his classroom or school.", "She has a college boyfriend and is new to the area. Her engine is youth, novelty, sparkle, and the contrast between people her own age and Cliff's more settled professional energy.", "Multiple substantial parts survive, but no single assembled authority has been recovered yet."], "signals": "Adult fiction · 22/32 age gap · new teachers · different schools · boyfriend · novelty / groundedness contrast"}];
const TRACY_STORY="\n\nCliff was not listening to me.\n\nI knew this because he was standing at the supply counter with his back half-turned, uncapping a blue marker with his teeth while trying to tape a torn label back onto the block bin.\n\nNobody listening to another adult should be doing three things at once.\n\nEspecially not Cliff.\n\nCliff doing three things at once usually meant one of them was about to become four things and at least one object would disappear forever.\n\n“So after snack,” I said anyway, “I was thinking we could leave the story table open instead of breaking it down.”\n\n“Mm-hm.”\n\nThat was not encouraging.\n\nI kept going.\n\n“The kids could draw one piece from the story in the morning, and then after lunch we put the drawings out with the puppets. Let them retell it however they want. We can photograph whatever they build and use that for the family board.”\n\nCliff pressed the label flat with the side of his fist.\n\n“Mm.”\n\nI looked at the back of his head.\n\nThere were times when working with Cliff was very much like working beside an enthusiastic golden retriever who had somehow passed a background check.\n\n“Never mind,” I said.\n\nHe turned.\n\n“What?”\n\n“Nothing.”\n\n“No, you said never mind.”\n\n“You’re busy.”\n\n“I’m labeling.”\n\n“You’re chewing a marker.”\n\nHe took it out of his mouth and looked at it as though this information had surprised him.\n\n“I was not chewing it.”\n\n“There are teeth marks.”\n\n“Circumstantial.”\n\nI laughed despite myself and reached for the stack of paper beside me.\n\n“It’s fine. I can figure it out.”\n\nCliff stared at me for a second.\n\nThen he pointed the blue marker at the story table.\n\n“No, I like it.”\n\nI looked up.\n\nHe went on.\n\n“The drawings become the props, right? So we’re not making some whole new teacher-created setup they’re supposed to care about.”\n\nI stopped moving.\n\n“And if we take pictures while they’re retelling,” he said, “then the family board isn’t us pretending we know what the important part was. It’s literally whatever they chose.”\n\nI said nothing.\n\nCliff frowned.\n\n“What?”\n\n“You were listening.”\n\nHe blinked.\n\n“Yeah.”\n\n“You were fixing the bin.”\n\n“I can do two things.”\n\n“You were doing at least four.”\n\nHe looked down at the tape in one hand and the marker in the other.\n\n“Okay, that’s fair.”\n\nThen he nodded toward the table again.\n\n“Do it. I think it’s good.”\n\nThat should have been the end of it.\n\nA coworker listened while I talked.\n\nCongratulations to him.\n\nPut it on a fucking certificate.\n\nExcept something in me had already prepared for the other version.\n\nThe version where I finished talking, realized I had been talking mostly to myself, and quietly took care of it because that was easier than asking anybody to come back and hear me properly.\n\nInstead Cliff had been listening so closely he had caught the part I had not even been sure was the point.\n\nI looked down at his hand.\n\nThere was blue marker across the side of his thumb.\n\nNot a lot.\n\nJust a crooked smear where he had apparently missed the label and colored himself instead.\n\nFor some reason, that was what stayed.\n\nNot what he said.\n\nNot even the surprise of being heard.\n\nBlue marker.\n\nHis thumb.\n\nRidiculous.\n\n“Tracy?”\n\nI looked up.\n\n“What?”\n\n“You just went somewhere.”\n\n“I’m standing right here.”\n\n“Physically.”\n\n“Go finish destroying that marker.”\n\nHe grinned.\n\n“Yes, ma’am.”\n\nThat was Tuesday.\n\nBy Wednesday morning I had forgotten the entire thing.\n\nMostly.\n\nI had a husband, two children who were technically old enough to stop needing me every six minutes and had declined the opportunity, nineteen small humans who definitely were not, and a classroom that produced mess at a rate I considered scientifically impossible.\n\nI did not have time to be emotionally affected by office supplies.\n\nAt 7:19, the classroom door opened.\n\nCliff came in looking like death had gotten bored halfway through killing him.\n\n“Morning,” he said.\n\nI looked at the clock.\n\n“Cutting it close.”\n\nHe stopped.\n\nNot actually late.\n\nThat was the annoying part.\n\nCliff normally arrived early enough that I had apparently developed the entitlement to interpret 7:19 as a personal betrayal.\n\nHe let his backpack slide off one shoulder and onto the floor.\n\n“Mm-hm.”\n\nHis hair was damp. His shirt was wrinkled at the collar. He looked down at the coffee in his hand like he had recently learned it existed.\n\n“You okay?”\n\n“Yeah.”\n\nHe opened a cabinet.\n\nThen just stood there.\n\n“Cliff.”\n\n“Mm?”\n\n“You sure?”\n\nHe closed his eyes.\n\nRubbed both hands down his face.\n\nSlowly.\n\nHis shoulders dropped with them.\n\nIt lasted maybe three seconds.\n\nThat was all.\n\nThree seconds of a man I had worked beside for months apparently forgetting to be funny.\n\nThen he exhaled.\n\n“Actually?”\n\n“What?”\n\n“I’m fucking exhausted.”\n\nI laughed.\n\nHe opened one eye.\n\n“No, seriously. I stood in my kitchen this morning holding my coffee and looking for my coffee.”\n\n“It was in your hand?”\n\n“For an uncomfortable amount of time.”\n\n“That’s impressive.”\n\n“Thank you.”\n\nThere.\n\nCliff again.\n\nThe room settled back into place.\n\nI turned to the tables and went back to setting out materials.\n\nHe moved behind me, pulling bins from the cabinet.\n\n“Hey.”\n\n“What?”\n\n“Thanks for doing this.”\n\nI looked at the trays.\n\n“It needed to get done.”\n\n“I know.”\n\nHe kept walking.\n\nThen, without changing his pace:\n\n“You always make mornings easier.”\n\nMy hand stopped over a cup of pencils.\n\nCliff did not stop.\n\nThat mattered.\n\nHe did not turn around to see if the line worked.\n\nHe did not lower his voice.\n\nHe did not smile at me like he had just said something clever.\n\nHe simply said it because, apparently, he thought it.\n\nYou always make mornings easier.\n\nI put the pencil in the cup.\n\nThen another.\n\nThen I realized I had put the same pencil in twice because I was still holding it.\n\n“For fuck’s sake,” I muttered.\n\n“What?” Cliff called from the other side of the room.\n\n“Nothing.”\n\n“That sounded like something.”\n\n“Do your job.”\n\n“Hostile work environment.”\n\nChildren arrived twelve minutes later and saved me from thinking about any of it.\n\nThat was one of the useful things about teaching small children.\n\nThere was only so long an adult could contemplate the meaning of a sentence before someone announced that their sock felt wrong.\n\nBy eight-thirty, one child had cried because another child owned a shirt with a dinosaur on it, somebody had hidden a plastic carrot inside a dollhouse toilet, and Cliff had somehow acquired a sticker on the back of his neck without noticing.\n\nNormal.\n\nGood.\n\nI preferred normal.\n\nAt the story table, the idea from Tuesday worked better than I had expected.\n\nThe kids ignored the actual plot almost immediately, which meant they understood the assignment perfectly.\n\nA paper wolf became somebody’s grandmother. A yellow scribble became a volcano. One of the puppets spent ten minutes trapped beneath a wooden taco.\n\nCliff sat on a chair designed for a person approximately one-third his size, knees up near his chest, listening to a little girl explain why the wolf had to go to space.\n\n“No way,” he said.\n\nShe nodded with complete seriousness.\n\n“A purple spaceship?”\n\nAnother nod.\n\nHe leaned forward.\n\n“That changes everything.”\n\nI smiled before I could stop myself.\n\nHe did that.\n\nGave people the stage.\n\nChildren, parents, staff. Me.\n\nIf somebody was talking and Cliff cared, he did not just wait for the noise to stop so he could speak again.\n\nHe reacted.\n\nAsked questions.\n\nRemembered pieces later.\n\nMade the person talking feel like the interesting part of the room.\n\nI had known that about him for months.\n\nSo why had I only started noticing that I knew it?\n\nThat question irritated me enough that I went to find scissors.\n\n“Tracy.”\n\nI ignored him.\n\n“Tracy.”\n\n“What?”\n\n“Where are the good scissors?”\n\nI looked over.\n\nHe was standing by the supply cabinet, opening and closing drawers with the confidence of a man who expected objects to reorganize themselves around his needs.\n\n“You lost them.”\n\n“I reject the premise.”\n\n“You were holding them yesterday.”\n\n“That sounds circumstantial.”\n\n“They’re in the second drawer.”\n\n“I checked.”\n\n“No, you looked.”\n\n“Same thing.”\n\n“It absolutely is not.”\n\nI walked over.\n\nCliff stepped sideways.\n\nNot quite enough.\n\nMy arm brushed his when I reached past him.\n\nFabric against fabric.\n\nNothing.\n\nI opened the second drawer and pulled out the scissors sitting directly on top.\n\nHe stared at them.\n\nThen at me.\n\n“How the fuck did you do that?”\n\n“They’re where they always are.”\n\n“Witchcraft.”\n\nI held them out.\n\nHis fingers closed over the handles at the same time mine released.\n\nOne of his fingers touched the side of mine.\n\nAgain, nothing.\n\nA completely ordinary exchange of classroom equipment between two adults who had transferred objects between them hundreds of times.\n\n“Thanks,” he said.\n\n“Try remembering where they live.”\n\n“No promises.”\n\nHe walked away.\n\nI stayed beside the cabinet.\n\nOne second.\n\nMaybe two.\n\nThen I looked down at my hand.\n\nAbsolutely fucking ridiculous.\n\nI spent the rest of the day proving to myself that it was ridiculous.\n\nWhich mostly meant noticing Cliff far more often than I would have if I had simply left the thought alone.\n\nHis laugh from the other side of the room.\n\nThe way he looked toward me whenever one of the kids said something insane, like I was the person he wanted to make sure had heard it too.\n\nThe blue marker still faintly visible on his thumb.\n\nThat last one pissed me off.\n\nBecause I had not gone looking for it.\n\nI had simply seen his hand while he was helping a child tape two pieces of paper together.\n\nBlue.\n\nStill there.\n\nMy stupid brain recognized it before I had consciously registered his hand.\n\nAt home that night, Kirt was standing in the kitchen in running shorts, eating chicken directly out of the container.\n\nI put my bag down.\n\n“Plate?”\n\nHe looked at the fork in his hand.\n\n“This is a plate.”\n\n“That is Tupperware.”\n\n“Portable plate.”\n\nTwenty-four years of marriage had not improved either of us.\n\nI opened the refrigerator.\n\n“How was school?” he asked.\n\n“Fine.”\n\n“Just fine?”\n\n“One kid put a carrot in a toilet.”\n\nHe stopped chewing.\n\n“Real toilet?”\n\n“Dollhouse.”\n\n“Okay. Less interesting.”\n\n“I disagree.”\n\nHe smiled.\n\nThere was nothing wrong with the smile.\n\nNothing wrong with him.\n\nThat was important too.\n\nKirt was not a monster waiting at home so I could feel noble for noticing another man.\n\nHe was my husband.\n\nHe knew which side of the bed I slept on. He knew I hated the sound of forks scraping ceramic. He knew which cereal I bought when I was sick and which one I bought when I was pretending I was going to eat healthier.\n\nHe also knew how to irritate me with six completely reasonable words.\n\n“You going to the gym tomorrow?”\n\nI closed the refrigerator.\n\n“Maybe.”\n\n“You haven’t gone much this week.”\n\n“I know.”\n\nHe nodded.\n\nNo accusation.\n\nNo insult.\n\nJust information.\n\n“You were getting into a good rhythm.”\n\nThere it was.\n\nI hated that sentence.\n\nNot because he meant anything cruel by it.\n\nHe didn’t.\n\nKirt liked systems. Progress. Numbers. The satisfaction of doing something three times a week and being able to point at the result.\n\nHe liked the gym because the gym made sense.\n\nPut in work. Improve.\n\nI had liked that too once.\n\nSometimes I still did.\n\nBut there were nights when his attention landed on me and I could almost feel the invisible clipboard in his hand.\n\nHow are we doing?\n\nWhat could improve?\n\nWhat slipped this week?\n\nHe never said any of that.\n\nThat was just how function card(b){return `<a class="card" href="#/book/${b.id}"><div class="card-top"><div class="book-number">${esc(b.label)}</div><span class="state">${esc(b.state)}</span></div><h2>${esc(b.name)}</h2><p>${esc(b.hook)}</p><span class="book-status">${b.ready?'Draft available':'Meet her'}</span></a>`}
function renderHome(){const ranked=BOOKS.filter(b=>b.label.startsWith('BOOK'));const recovered=BOOKS.filter(b=>!b.label.startsWith('BOOK'));root.innerHTML=header()+`<main class="shell home"><section class="hero"><p class="kicker">Private Light Reader</p><h1>Falling Off a Cliff</h1><p class="subtitle">Every fall starts somewhere ordinary.</p><p class="preview-note">This is the current working shelf, not a publication build. Tracy opens into the normalized draft. The other cards show the distinct story engines we have actually recovered.</p></section><section class="toc"><div class="section-label">Current Books</div><div class="grid ranked">${ranked.map(card).join('')}</div></section><section class="toc"><div class="section-label">Recovered Story Lanes</div><div class="grid">${recovered.map(card).join('')}</div></section></main>`;window.scrollTo(0,0)}
function renderBook(b){root.innerHTML=header()+`<main class="profile-shell"><a class="back-link" href="#/">← Shelf</a><article class="profile"><div class="topline"><p class="kicker">${esc(b.label)}</p><span class="state">${esc(b.state)}</span></div><h1>${esc(b.name)}</h1><p class="profile-hook">${esc(b.hook)}</p><div class="facts">${b.facts.map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="copy">${b.intro.map(x=>`<p>${esc(x)}</p>`).join('')}</div><p class="signals">${esc(b.signals)}</p><button class="read-button" ${b.ready?'':'disabled'}>${b.ready?readLabel():'Not normalized yet'}</button><p class="caveat">${b.ready?'Current normalized four-chunk draft. Later recovered Tracy material is still being evaluated, and the first explicit encounter contains one marked authoring seam.':'Source exists, but it has not been normalized into reader text yet.'}</p></article></main>`;const btn=root.querySelector('.read-button');if(b.ready)btn.onclick=()=>{if(readProgress().completed)localStorage.removeItem(progressKey);location.hash='#/read/tracy'};window.scrollTo(0,0)}
function readProgress(){try{return JSON.parse(localStorage.getItem(progressKey)||'{"scrollY":0,"completed":false}')}catch{return {scrollY:0,completed:false}}}
function readLabel(){const p=readProgress();return p.completed?'Read Again':p.scrollY>40?'Continue Reading':'Read Current Draft'}
function storyHtml(){let blocks=TRACY_STORY.split(/\n\s*\n+/).map(s=>s.trim()).filter(Boolean);let out=[];for(let i=0;i<blocks.length;i++){let x=blocks[i];if(x==='[[PREVIEW_SEAM]]'){out.push(`<aside class="draft-seam"><span>Draft seam</span><strong>The intended high-heat first encounter is not rendered in this preview yet.</strong><p>The canonical aftermath resumes immediately below, so you can still judge the story's full shape.</p></aside>`);continue}if((x==='Me:'||x==='Cliff:')&&blocks[i+1]){const sp=x.slice(0,-1);out.push(`<div class="sms ${sp.toLowerCase()}"><span>${esc(sp)}</span><p>${esc(blocks[++i])}</p></div>`);continue}if(x.startsWith('#'))continue;out.push(`<p>${esc(x)}</p>`)}return out.join('')}
function renderStory(){root.innerHTML=header()+`<main class="reading-shell"><div class="reading-topbar"><a class="back-link" href="#/book/tracy">← Tracy</a><span>BOOK 1 · current draft</span></div><article class="story"><h1>Tracy</h1><div class="draft-banner">Private working draft · internal chunk boundaries hidden</div>${storyHtml()}<div class="end">Current draft endpoint</div></article></main>`;const p=readProgress();requestAnimationFrame(()=>window.scrollTo({top:p.completed?0:p.scrollY,behavior:'instant'}))}
let saveTimer;addEventListener('scroll',()=>{if(location.hash!=='#/read/tracy')return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const max=Math.max(1,document.documentElement.scrollHeight-innerHeight),y=Math.max(0,scrollY);localStorage.setItem(progressKey,JSON.stringify({scrollY:y,completed:y/max>=.96}))},120)},{passive:true});
function route(){const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);if(!parts.length)return renderHome();if(parts[0]==='book'){const b=book(parts[1]);return b?renderBook(b):renderHome()}if(parts[0]==='read'&&parts[1]==='tracy')return renderStory();renderHome()}addEventListener('hashchange',route);route();
</script></body></html>
