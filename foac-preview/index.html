ate. Thank you again.”\n\nBut his eyes didn’t move. Didn’t slide away like most men’s do once they’ve ticked the polite box. He held me there, waiting for an answer I didn’t have.\n\nWas I okay?\n\nMy son tugged again, whining about the car ride. Cliff finally gave me a nod, like he’d let me off the hook. But the question had already lodged in me like a stone in my shoe.\n\nWe walked toward the door. My son chattered, swinging my hand, but I barely heard him. My head was spinning.\n\nWhy would he ask me that?\n\nBecause I looked frazzled? Because I was late, flushed, hair messy, shirt clinging with sweat from rushing? Or because he saw something I didn’t even realize I was showing?\n\nI stole one last glance over my shoulder.\n\nHe was standing by the tub, ball tucked under his arm, watching us leave. The grin softer now, almost thoughtful. His chest still heaving faintly, sweat glistening at the hollow of his throat. His size filled the space like he belonged in it.\n\nAnd my body betrayed me. A flicker low in my stomach, a warmth spreading through me that had no business being there.\n\nI looked away quickly, face hot.\n\nIn the car, my son buckled himself in, still talking about “Mr. Cliff” like he was the greatest thing since superheroes. I gripped the steering wheel tight, knuckles white, my heart hammering.\n\n“You okay?”\n\nThree little words, and I was spiraling.\n\nBecause no one asks me that anymore. Not like that. My husband asks if I paid the bills, if I remembered the dry cleaning, if the kids’ lunches are packed. He doesn’t pause, tilt his head, lower his voice like he’s actually measuring my answer.\n\nCliff had.\n\nAnd I couldn’t stop seeing him. The sweat, the grin, the way he crouched low to meet my son’s eyes, the broadness of him up close, the size of his hand palming the basketball like it weighed nothing.\n\nIt should’ve been simple gratitude. That’s all. He entertained my kid while I was late. He asked if I was okay because I looked frazzled. w I was doing.”\n\nHe blinked, like I’d spoken in another language. “What?”\n\n“You didn’t ask,” I said again, louder now, shaking. “You came at me, scolding me, like I’m another one of the kids you have to discipline. You didn’t even look at me.”\n\nHis jaw clenched. “I do look at you.”\n\n“No, you don’t.” My laugh came out bitter. “You look at what I forgot, what I missed, what I’m late for, what needs fixing. But not at me. Not once did you pause and say, hey, are you okay?”\n\nSilence filled the kitchen, heavy and suffocating. My son’s footsteps thundered upstairs, mercifully oblivious.\n\n“Jesus,” my husband muttered, rubbing his forehead. “You’re really going to make this into a whole thing? I just asked you to be on time.”\n\n“Not a whole thing? Do you even hear yourself?” My voice cracked. “Do you know what it feels like to be drowning all day and then walk in here and get smacked in the face for not being perfect?”\n\n“I didn’t smack you in the face,” he snapped, voice rising. “Stop exaggerating.”\n\n“I’m not exaggerating!” I shouted back. “You don’t get it. You don’t see me. I’m late, I’m wrong, I’m messy—and you think that’s all there is to me.”\n\nHis eyes hardened. “What do you want me to do, throw you a parade because you had a bad day?”\n\nI flinched. The words hit deeper than they should have.\n\n“No,” I whispered. “I just wanted you to ask.”\n\nThe room went still. The hum of the fridge seemed louder, the clock ticking on the wall mocking me.\n\nHe shook his head slowly, disbelief etched across his face. “You’re impossible sometimes.”\n\n“And you’re cold,” I snapped before I could stop myself. “You’ve been cold for years.”\n\nThat shut him up. His mouth opened, closed, his shoulders squared like he was ready for a fight he didn’t want to finish.\n\n“Don’t,” he said finally, voice low. “Don’t twist this into something it’s not.”\n\nMy chest ached, breath coming shallow. “It’s already twisted.”\n\nWe stood there, locked in silence, both of us bleeding g at me. “I’m tired.”\n\n“I know.” I pressed a kiss against his shoulder. “Just… come here.”\n\nFinally, he set the phone on the nightstand with a too-loud clack. “What?”\n\nI slid closer, draping a leg over his. My hand moved down his chest, tentative, testing. “I want you.”\n\nHe stiffened. “Now?”\n\n“Yes, now.” My voice cracked, more pleading than I meant. “Please.”\n\nHis hand caught mine before it slipped lower. He pushed it away, firm. “Not tonight.”\n\nThe words stung, sharper than they should have. “Why not?”\n\n“Because,” he said flatly, “I’m still pissed.”\n\nI pulled back, staring at him in the faint light. “Pissed at me? Still? After all that?”\n\n“You were late. Again. And then you blew up on me. And now you think sex is going to… what, fix it?”\n\nI swallowed hard. “I don’t think it’ll fix anything. I just—”\n\n“What?” He turned to me, eyes hard. “What do you want, exactly?”\n\nMy chest tightened. “I want to feel close to you.”\n\nHe laughed, bitter and short. “Close? You screamed at me two hours ago.”\n\nI flinched. “Because you don’t see me. You don’t even ask if I’m—” I cut myself off, biting the words before they spilled.\n\nHis jaw set. “Don’t start again.”\n\nSilence pressed down heavy, the kind that doesn’t let you breathe.\n\nI tried once more, my hand brushing his chest, my lips brushing his neck. “Please,” I whispered.\n\nHe shoved me back—not hard, but enough. Enough to feel like a door slamming in my face.\n\n“Stop,” he said. “I don’t want to.”\n\nI froze. The sheet tangled around my legs, heat draining from my body, shame rising like bile.\n\n“Fine,” I whispered, rolling away.\n\nThe mattress shifted as he turned back to his phone, scrolling again like I hadn’t just laid myself bare.\n\nMy face pressed into the pillow, hot with humiliation. Tears pricked, but I blinked hard, refusing to let them fall. My body still buzzed from the shower, the ache between my thighs sharp and restless, but now it twisted into something uglier—loneliness, rejection, need with nowhere to go.\n\nI’d reached for him. And he’d pushed me away.\n\nIn the dark, my mind betrayed me again. Cliff’s voice replayed, soft, steady. You okay?\n\nI clenched the pillow tighter, breath shaky. My husband was inches away, warm beside me, and yet I had never felt further from him.\n\nI hated that another man’s words lingered where his touch should have been. I hated that I craved the way Cliff’s eyes had held mine, even for a breath.\n\nBut most of all, I hated that when I asked for closeness tonight, the man I married shut me out. And the man who shouldn’t even matter… felt like the only one who saw me.\n\n-\n\nHer POV – First Person\n\nI didn’t even bother drying my hair properly, just yanked it into a knot and pulled on leggings and an old sweatshirt. Fuck him. Fuck his cold shoulder, his push away, his scrolling on the phone like I was a nuisance. If he didn’t want me, fine. I’d get my dopamine another way.\n\nCoffee ice cream. Half a carton if I felt like it.\n\nThe fluorescent lights of the grocery store hummed too loud as I stalked down the aisles, cartless, arms folded tight. My reflection in the freezer doors looked exactly how I felt—tired, raw, annoyed, my eyes shadowed from crying in the shower earlier. Not dolled up, not soft. Just… me, stripped bare and prickly.\n\nThe ice cream aisle stretched like a shining altar, rows of frosty cartons waiting to be ripped open. I crouched down, scanning the labels. Coffee. Mocha chip. Espresso swirl. If it had caffeine and sugar, I wanted it.\n\nAnd then I heard it.\n\n“Hey.”\n\nI froze. That voice.\n\nI turned, half expecting the universe to play some cruel trick. And there he was. Mr. Cliff. Standing three feet away in a faded t-shirt, joggers, sneakers still smudged like he’d just come from a run. A six-pack of sparkling water in one hand, his eyes wide like he was just as surprised to see me.\n\n“Oh,” I blurted. My heart gave a traitorous thud. “Hi.”\n\nHe grinned, that easy grin that \nI felt my breath catch, throat tightening. No one was supposed to see that. I worked hard to keep it buried. And yet he said it so simply, like it wasn’t a weakness but just… a truth.\n\nI laughed again, softer this time, shaking my head. “You don’t even know me.”\n\nHis smile widened just enough. “I know enough.”\n\nThe freezer hummed behind us, the cold air prickling my bare ankles. My pulse pounded in my ears. He stood there, calm, steady, offering me a crack in the walls I lived inside every day.\n\nAnd the crazy part was—I wanted to step through.\n\n“Fine,” I muttered, grabbing another spoon from the shelf. “But only because I already wanted this.”\n\nHis grin turned mischievous. “Deal.”\n\nWe walked toward the checkout together, and I felt that strange, stupid thing again—the room, even this ugly fluorescent grocery store, shifted around him. The air wasn’t suffocating anymore.\n\nAnd I couldn’t stop thinking, as we stepped out into the cool night, that I was about to eat ice cream at the park with Mr. Cliff.\n\n-\n\nHer POV – First Person\n\nWe found a bench beneath a crooked lamppost, the light dim and sputtering like it was tired of working nights. The park was nearly empty—just the chirp of crickets, the distant hum of traffic, and the occasional rustle of leaves in the late summer air. I sat, carton in hand, spoon already halfway in my mouth before I realized how absurd this was.\n\nMe. Leggings. Messy bun. Coffee ice cream at ten at night. Sitting next to Mr. Cliff like it was the most natural thing in the world.\n\nExcept it wasn’t. Not for me.\n\nI snuck a glance at him. He’d already dug in, quiet, steady. He sat with one leg stretched out, the other bent, carton balanced neatly on his thigh. He ate like he wasn’t in a rush, like the whole night was his to waste. Every few bites, he glanced over at me. Not staring. Just checking in. Then back to his ice cream.\n\nNo words. Just… him. Present.\n\nMy brain, of course, wouldn’t shut the fuck up.\n\nWhy was I here? Why had I agreed to this? Ice cream in the park at night with a man who wasn’t my husband. A man I barely knew, really, other than the flashes I’d clocked—the trip at the PTA meeting, the grin, the way he made the stale room breathe again. Him drenched in sweat after playing basketball with my son when I was late. Him asking, simply, “Are you okay?” like he had any right to.\n\nI licked my spoon, the cold sharp against my tongue. Maybe I just needed this. A breather. A pause button. Someone who wasn’t looking at me like I was failing all the time.\n\nI hated that thought. I hated that it was true.\n\nHe shifted slightly, shoulders rolling as if to stretch out some knot, and I couldn’t help but notice—broad. He was broad. Solid. The kind of guy you’d underestimate until you saw him catch himself from falling, make a joke mid-fumble, and still walk away with the room in his pocket.\n\nStop it, I told myself. He’s just eating ice cream. He’s just a teacher. He’s just Cliff.\n\nBut then he glanced at me again, and my chest tightened. He didn’t speak. He didn’t need to. His eyes said enough—measured, patient, like he was willing to sit here all night until I was the one to break the silence.\n\nWhich made my brain spiral harder.\n\nWhat was I supposed to say? “Hey, thanks for playing basketball with my kid because I was too late, too careless, too fucking wrapped up in my day”? Or maybe, “Sorry you had to see me unravel like a complete failure of a mom”?\n\nNo. I wasn’t going to say that. I wasn’t going to hand him the mess of my life tied up in a bow.\n\nSo I shoveled another bite of ice cream instead. Cold. Sweet. Bitter coffee bite lingering at the back of my tongue. I hated how much I needed it.\n\nThe silence pressed heavier. He didn’t fill it. He didn’t fidget. He didn’t talk just to talk. And it made me wonder—did he know? Did he know how suffocating my own head was, that silence to me wasn’t empty, it was a minefield?\n\nAnother glance. Another pause. Another spoonful.\n\nI wanted to shake him. Or kiss him. Or scream. Something. Anything to break the steady calm of him sitting there, letting me unravel without interruption.\n\n“You’re quiet,” I muttered finally, my voice sounding too sharp in the still night.\n\nHe glanced at me, spoon paused mid-air. Then he smiled faintly, shrugging one shoulder. “Just eating ice cream.”\n\nThat’s it. That’s all he said. Like the act itself was enough.\n\nAnd somehow, it was infuriating.\n\nBecause I wanted to demand: How are you so calm? Don’t you see me falling apart? Don’t you notice the way I can’t stop thinking about everything—about my husband pushing me away, about the PTA meeting, about how even now I feel both ridiculous and alive, sitting here with you?\n\nBut I didn’t say any of that. I just shoved another spoonful in my mouth, the cold burning behind my teeth.\n\n“You always this patient?” I asked, softer this time.\n\nHe looked at me again. His pause lingered, like always, deliberate. Then he smiled, slow and warm. “Not always.”\n\nAnd that was it. No explanation. No long-winded answer. Just… enough.\n\nI laughed under my breath, shaking my head. My brain wouldn’t stop firing, but my body—my body was starting to unclench. Shoulders loosening. Breath steadying. Like his calm was contagious, leaking into me whether I wanted it to or not.\n\nWe ate in silence again. The park stretched quiet and endless around us. And I realized something terrifying.\n\nFor the first time in weeks, maybe months, I wasn’t drowning in the noise of my own life. I was drowning in him instead.\n\n-\n\nHer POV – First Person\n\nThe spoon scraped the bottom of the carton, the sound sharp in the hush of the park. I winced at it, like I’d broken some fragile spell, then muttered, “Guess I was hungrier than I thought.”\n\nCliff chuckled low, a sound that rumbled more than laughed. He tapped his spoon against his knee. “Guess so.”\n\nSimple. Easy. He had no idea the hurricane in my head.\n\nI kept talking, because I couldn’t stand the silence anymore. “Been one of those days, you know? The kind where you feel like the world’s just daring you to fuck up.”\n\nHe didn’t comment, just took another bite. I wanted him to say something, anything, so I filled the space myself. “I was late picking up my son. Again. My husband wasn’t thrilled about that. Not that he’s thrilled about much lately.”\n\nI said it lightly, tossed it out like a paper napkin, like it didn’t matter. A nothing line. I’d said worse in the kitchen to a husband who barely looked up from his phone.\n\nCliff’s spoon paused midair.\n\nShit.\n\nHe didn’t look away. His eyes stayed steady on me, and I felt the air sharpen, turn heavier, like I’d just stepped on something I thought was grass but turned out to be glass.\n\n“What do you mean by that?” he asked finally, voice low.\n\nI laughed too quickly, waved my spoon in the air. “Nothing. Just married-people stuff, you know? Bickering, moods. Comes with the territory.”\n\nHe tilted his head, slow, deliberate. “You said not thrilled about much lately.”\n\nMy chest tightened. He had heard. Not just heard—caught it. Rewound it. Spotlighted it.\n\nI forced another laugh, brighter this time, shoving ice cream into my mouth to shut myself up. “Don’t overanalyze. It’s just me venting. Ignore me.”\n\nHe didn’t. He set his carton down on the bench beside him, spoon still sticking up like a flag. Then he leaned back, stretched his arm across the top of the bench, casual as hell, but his eyes stayed locked on me.\n\n“You ever say things like that just to see if anyone’s listening?”\n\nI blinked at him, caught mid-breath. “What?”\n\n“Like you don’t expect anyone to care. So you drop it in there, dressed up, half a joke, half a shrug. Then if nobody bites, you can pretend it was nothing.”\n\nHis words landed hard, too close, too sharp. He had no right to know me like that.\n\n“Maybe,” I muttered, staring at my spoon. “Why, you taking notes on my therapy session now?”\n\nHe didn’t flinch. Just watched me, steady. “No. Just seems like you deserve someone to actually hear you.”\n\nThat hit like a punch. My throat went dry.\n\nI wanted to brush it off. To say, please, you don’t know me, you don’t know my marriage, this isn’t your business. But the thing was… he wasn’t wrong. And that made it worse.\n\nI fiddled with the empty carton, peeling back the soggy paper seam. “It’s not like I haven’t said it before. To him. I have. He just… doesn’t hear it.”\n\nThe words slipped out softer, truer. My chest ached the second I said them.\n\nCliff didn’t move. Didn’t speak right away. He let the silence hold, like he knew I’d try to run from it if he gave me the chance.\n\nFinally, he murmured, “That sounds lonely.”\n\nLonely. The word landed in my gut, heavier than the ice cream, heavier than the whole damn day. I felt my throat burn, and for a second I thought I might actually cry—here, on a park bench, with a man I barely knew.\n\nI snapped my gaze away, focused on the cracked sidewalk, the shadows from the lamppost. “Don’t,” I said, voice sharp.\n\n“Don’t what?”\n\n“Don’t make it sound like more than it is. It’s just marriage. People get comfortable. People stop listening. That’s just… how it goes.”\n\n“Doesn’t have to.”\n\nI hated how steady he sounded. Like he wasn’t accusing. Like he wasn’t pitying me. Just stating fact.\n\nI clenched my spoon harder than I needed to, the edge biting into my palm. My brain screamed at me to change the subject, laugh it off, talk about the weather, the PTA, anything. But my body wouldn’t move. I sat frozen, aware of how close he was, of the weight of his arm stretched behind me on the bench, of the heat radiating from him in the cool night air.\n\nMy voice came out a whisper I didn’t mean to say out loud. “I don’t even know why I bother sometimes.”\n\nI meant it about talking. About trying. About clawing my way to be heard in a house where silence and irritation had become the soundtrack.\n\nBut the second I said it, I wished I could drag it back down my throat.\n\nBecause Cliff turned his head toward me, slowly, like he was rewinding again, spotlighting again. His eyes caught mine in the dim glow.\n\n“You just did,” he said. Quiet. Solid. No judgment.\n\nAnd I couldn’t look away.\n\n-\n\nHer POV – First Person\n\nThe silence had stretched too long, and I could feel myself caving under it. I shifted on the bench, carton crushed in my lap, spoon tapping against the paper rim. My brain wouldn’t shut up. My chest was tight.\n\nThen Cliff finally spoke.\n\n“Maybe your husband’s right.”\n\nMy head snapped toward him. “Excuse me?”\n\nHe shrugged, spoon still lazily circling his ice cream, like he hadn’t just set off an earthquake in my chest. “I mean, maybe you are the problem sometimes.”\n\nMy mouth dropped open. “Wow. Thanks. Really fucking comforting.”\n\n“I didn’t say you were a bad person.” His voice was steady, annoyingly calm. “I’m just saying—maybe he’s not always wrong.”\n\nAnger shot up hot and fast. My face burned. “You don’t even know me. Who the hell are you to—”\n\nHe cut me off, gentle but firm. “I’m not judging you. I don’t think less of you. I’m just pointing out… we’re human. We mess up. Maybe you did today. Maybe you do sometimes. That doesn’t mean you’re bad.”\n\nI stared at him, pulse hammering in my ears. I wanted to stay mad. I wanted to rip into him. But his eyes—steady, calm, maddeningly kind—made my words falter.\n\n“I screw up plenty,” he continued, like he wasn’t afraid of the storm brewing in me. “All the time, actually. I make dumb choices. Do chaotic shit that doesn’t make sense until after the fact. Half the time I’m just trying to keep from falling on my face.”\n\n“That’s different,” I muttered, though my voice had softened.\n\nHe shook his head, lips twitching into that lopsided grin. “Not really. Look, if you were Ms. Perfect, Ms. Vanilla, we wouldn’t even be sitting here right now, would we?”\n\nI blinked at him.\n\nHe leaned back, stretching his arm along the bench again. “If you were the mom who was always on time, always composed, always got her shit together—then you wouldn’t have ended up late. You wouldn’t have caught me sweaty and stupid playing basketball with your kid. We wouldn’t have had this.” He gestured to the empty cartons between us, to the quiet park. “And honestly? That’d be boring as hell.”\n\nMy cheeks burned hotter. I hated that his words made sense. That little flick of pride at the thought that he found me interesting—even if it was for my flaws.\n\nI crossed my arms. “So I’m what? Fun because I’m a disaster?”\n\nHis grin widened, but his eyes stayed soft. “You’re fun because you’re real. Because you’re not hiding behind some picture-perfect bullshit. Do you know how refreshing that is?”\n\nI opened my mouth, ready to argue, but nothing came out. My brain scrambled for something sharp, something defensive, but instead I just sat there, pulse rattling, ice cream melting in my lap.\n\nCliff took another bite of his carton, chewed, swallowed, then murmured, “Want to know what I did last week?”\n\nI didn’t answer, but he kept going anyway.\n\n“I set off the fire alarm at school. By accident. Burned popcorn in the teacher’s lounge.”\n\nA laugh burst out of me before I could stop it. “Seriously?”\n\n“Whole building evacuated. Kids standing outside in the cold, parents getting called. Principal looked like she wanted to strangle me.” He chuckled, shaking his head. “And I just stood there waving smoke out the window with a paper plate. Felt like an absolute idiot.”\n\nI tried to smother my laugh, but it spilled out anyway. The image was too vivid—him, tall, goofy, probably sweating buckets, fanning smoke like some sitcom character.\n\n“See?” he said, smirking. “I make mistakes. Constantly. Some small, some big. It’s part of the gig. Part of life. So when I hear you beat yourself up over being late, or say shit like ‘why bother’—I don’t see some monster wife screwing up her marriage. I see someone human. And honestly? Someone a little braver for admitting it out loud.”\n\nMy throat tightened again, but not from anger this time. From something else. Something that stung in a way I couldn’t brush off so easily.\n\n“You think I’m brave,” I said quietly, almost to myself.\n\n“I think you’re real,” he corrected. “And that’s a hell of a lot more interesting than pretending to be perfect.”\n\nI sat frozen, staring at the carton crushed in my lap, at the sticky spoon cutting into my palm. His words swirled in my head, colliding with everything my husband had thrown at me earlier, everything I’d thrown back.\n\nMaybe he was right. Maybe sometimes I was the problem. Maybe I did snap too quickly, push too hard, spiral too far. But Cliff’s tone—so steady, so easy—it didn’t sound like judgment. It sounded like permission. Permission to not be perfect. Permission to screw up and still sit here eating ice cream with someone who didn’t walk away.\n\nI swallowed hard, my voice breaking softer than I wanted. “You don’t even know me.”\n\nHe leaned in just slightly, eyes catching mine under the lamplight. “Not yet.”\n\nAnd that pause—God, that pause—held more weight than anything else.\n\n-\n\nHer POV – First Person\n\nThe night had grown quieter, the hum of traffic fading into something softer, something too still. I could hear the scrape of his spoon every time he dug into the carton, slow and unhurried, like he had all the time in the world. My chest felt tight, my own ice cream long melted into a soupy mess I wasn’t touching anymore.\n\nHe broke the silence first. “Can I ask you something?”\n\nI let out a bitter laugh. “Do I get a choice?”\n\nThat grin flickered across his face again, quick and sharp. “What do you value?”\n\nMy head snapped toward him. “What?”\n\nHe repeated it, calm, deliberate, like he was reading lines off a chalkboard. “What do you value?”\n\nI blinked at him, scrambling for words. “That’s a—what kind of question is that?”\n\n“The kind that matters.” He lifted another spoonful, paused midair, eyes still locked on me. “So. What do you value?”\n\nI hated how serious he looked. How steady. Like this wasn’t just small talk under a busted lamppost.\n\nI shifted, crossed my arms. “My son,” I said finally, too fast. “I value my son.”\n\n“Good.” He nodded, took the bite. Chewed. Swallowed. “What else?”\n\nI frowned. “That’s not enough?”\n\n“You tell me.” Another spoonful. Pause. His eyes caught mine again. “Is it?”\n\nI stared down at my carton, the melted mess sloshing when I tilted it. I wanted to say yes. That should be enough, right? Of course it was. But the silence pressed heavy, and my throat tightened, and I hated how much he seemed to know without me saying it.\n\n“I don’t know,” I muttered.\n\nHe nodded, like that was the answer he expected. Then he leaned back, stretched his long legs out in front of him, and asked, “Alright. What do you want?”\n\nThat question punched me harder than the first.\n\n“What do I want?” I echoed, stalling.\n\n“Yeah.” He scooped another bite, took his time. “What do you want?”\n\n“I want…” The words caught in my throat. My first instinct was to laugh it off, to say something safe, like more sleep, a clean kitchen, less laundry. But that wasn’t what came bubbling up, hot and shameful.\n\n“I want to be seen,” I whispered.\n\nI hadn’t meant to say it out loud. But there it was, hanging between us, undeniable.\n\nCliff didn’t react right away. He let it sit, the silence stretching so long I wanted to crawl out of my skin. Then he nodded slowly, setting his carton down on the bench.\n\n“That makes sense,” he said simply.\n\nMy chest burned. I wanted to snap, to say he was patronizing me, to tell him he didn’t understand. But his voice was too calm, too even, like he wasn’t judging—just reflecting.\n\n“And what can you do,” he asked finally, “to work toward that?”\n\nI let out a sharp laugh, shaking my head. “Jesus. You sound like a therapist.”\n\n“Maybe.” He shrugged, easy. “But I’m serious. You said what you value. You said what you want. So how do you move toward it?”\n\nI stared at him, angry at the question, angrier at myself for not having an answer.\n\n“What am I supposed to say?” My voice came out tight. “That I’ll buy a self-help book? Sign up for yoga? Start journaling?”\n\nHe didn’t flinch. “Maybe. Or maybe you start by saying it out loud. To the right people.”\n\n“I said it to my husband,” I snapped.\n\n“And?”\n\nThe word stung, sharp as a slap.\n\n“And he didn’t hear me,” I admitted, voice breaking.\n\nCliff leaned in slightly, eyes steady, voice low. “Then maybe you say it again. Louder. Or maybe you stop waiting for him to listen and start building places where you are heard.”\n\nI swallowed hard, my throat thick. The words were too much, too heavy. My eyes burned, and I hated that I wanted to cry in front of him.\n\n“Why are you doing this?” I whispered.\n\nHe tilted his head. “Doing what?”\n\n“Pushing me. Asking these… these questions.” My voice cracked. “You don’t even know me.”\n\nHis smile was small this time, almost sad. “You’re right. I don’t. But I see you.”\n\nThe words landed like a punch straight to the gut. My breath caught, sharp and shallow.\n\nI turned away, staring hard at the shadows on the grass, at the glint of the lamppost. My heart was pounding, my palms damp.\n\nSilence fell again, broken only by the soft scrape of his spoon digging into the carton. He didn’t press. He didn’t demand more. He just let me sit in it, stew in it, until I wanted to scream.\n\nI finally muttered, “You make it sound so simple.”\n\n“It’s not,” he said. “But simple doesn’t mean easy. Simple just means clear.”\n\nI squeezed the spoon in my hand until it bent, the cheap metal warping. My voice came out small. “What if I don’t like the answer?”\n\n“Then you change it,” he said, shrugging like it was the easiest thing in the world. “That’s the good part.”\n\nI looked at him then, really looked. His jaw shadowed in the lamplight, his hair still damp from the game earlier, shirt clinging faintly with sweat. He looked tired but steady. Messy but grounded. Like someone who’d stumbled a hundred times and still managed to stand tall.\n\nAnd suddenly I realized—I wanted more of this. More questions that hurt. More silences that broke me open. More of him.\n\nAnd that terrified me.\n\n-\n\nHer POV – First Person\n\nHe’d gone quiet again, finishing off the last streak of his ice cream, spoon clinking against the carton. The air was thick between us, like all the things he’d asked were still hanging there, unanswered, sticky as the melted mess in my lap.\n\nThen, out of nowhere, his voice cut sharp.\n\n“You care about your shirt?”\n\nI blinked at him. “What?”\n\nHe tilted his head, eyes narrowing just slightly, spoon balanced between his fingers like a weapon. “Your shirt. Your pants. Do you care about them?”\n\nThe question was so absurd it yanked me right out of my spiral. I looked down at myself—leggings, an old stretched-out t-shirt that used to be white before coffee stains and toddler handprints took over. “No?” I said slowly, suspicion creeping in.\n\nHe didn’t even hesitate. He flicked a spoonful of melting ice cream at me.\n\nIt splattered against my shirt, cold and sticky, dripping down in an ugly smear. I gasped, staring at him like he’d just committed an actual crime.\n\n“What the hell!”\n\nBut he didn’t flinch. He just leaned back, spoon dangling loose in his hand, expression infuriatingly calm. “Did you feel seen?”\n\nI gawked at him, caught between fury and disbelief. “You just threw ice cream at me.”\n\n“Answer the question.” His tone sharpened, quiet but firm. “Did you feel seen?”\n\nBefore I could stop myself, I barked out a laugh—half outrage, half shock. “What kind of psych experiment is this?”\n\nThen he did it again. Flicked another spoonful, this time landing squarely on my thigh.\n\nI jumped, the cold seeping through my leggings. “Cliff!”\n\n“Now?” he asked, eyes glinting. “Do you feel seen?”\n\nI froze, my heart hammering so hard I could barely think. The logical part of me screamed that I should be furious. This was ridiculous, childish, crossing some weird invisible line. But underneath, tangled and hot, something else pulsed. Confusion. Excitement. A buzzing energy in my chest I couldn’t explain.\n\n“What the fuck is wrong with you?” I hissed, though my voice cracked with something that wasn’t quite anger.\n\nHe leaned closer, just enough that his shoulder brushed mine. His voice dropped low, deliberate. “You said you wanted to be seen. I’m making sure you are.”\n\nMy breath caught.\n\nAnd then, before I could think too hard, I scooped up my own spoon, dug deep into my melted carton, and launched it straight at him.\n\nIt smacked his chest, streaking across his shirt in a messy brown smear. He glanced down at it, then looked back at me, and for the first time tonight, his grin wasn’t lopsided or teasing. It was wide. Dangerous.\n\n“Oh,” he murmured, brushing at the stain with his free hand. “So that’s how it’s gonna be.”\n\nSomething in my stomach flipped.\n\nThe next second, another spoonful of ice cream hit my arm, colder this time, running down my skin. I shrieked, half laughing, half furious, and retaliated, splattering him across the shoulder. He dodged the next one, laughing low, rich, the sound vibrating through the night air.\n\nWe were two grown adults, in the middle of a deserted park, having a silent war with melting cartons of coffee ice cream. And it was stupid. And chaotic. And messy.\n\nAnd I couldn’t remember the last time I’d felt so alive.\n\n“Stop!” I gasped, breathless, trying to shield myself with one hand while clutching the carton with the other. “You’re insane!”\n\nHe leaned in close, the spoon dripping between his fingers, voice rough with laughter. “Maybe. But you’re smiling.”\n\nAnd I was. I could feel it stretching across my face, hot and wide, uncontainable. I wanted to deny it, to scowl, to pretend I hadn’t fallen right into his game—but my chest was light, bubbling, buzzing in a way I hadn’t felt in years.\n\nI shoved another messy spoonful at him, catching the side of his jaw this time. He closed his eyes, wiped it with his thumb, and licked it off without breaking eye contact.\n\nMy breath stopped.\n\nIt was nothing. Just ice cream. Just a ridiculous little war. But the way he looked at me as he did it—steady, locked in, like he’d been waiting for me to notice—turned my stomach inside out.\n\n“You don’t know what you’re doing,” I whispered, my voice shaky, not sure if I meant it for him or for myself.\n\nHe leaned closer, so close I could smell the faint sweetness of coffee on his breath. “Neither do you. And that’s the point.”\n\nI froze, heart thundering, body caught between wanting to shove him back and wanting to close the tiny gap between us.\n\nThis wasn’t supposed to happen. Not here, not like this. And yet—ice cream dripping on my shirt, laughter still shaking in my chest, his eyes locked on mine—I couldn’t stop wondering what would happen if I didn’t move.\n\nIf I let him come closer.\n\nIf I let myself be seen.\n\n-\n\nHer POV – First Person\n\nThe ice cream war fizzled out into silence. My shirt was streaked with melted brown, my pants sticky, his chest smeared where I’d landed a good hit. We were ridiculous, messy, and for a moment I almost forgot why I’d come out here in the first place.\n\nBut then he looked at me. Really looked at me. Not grinning, not teasing. Just quiet. His eyes steadied, sharp but soft, and he said it again.\n\n“You okay?”\n\nThe question wasn’t about the stains. It wasn’t about the game. And I knew it.\n\nMy breath caught, spoon hanging limp in my hand. “I—yeah. I’m fine.”\n\nHe tilted his head. Waited. The silence was unbearable, pressing down harder than the laughter before.\n\nSomething in me cracked. Words spilled before I could stop them.\n\n“I went out for ice cream because my husband didn’t want to have sex with me.”\n\nIt came out too fast, too blunt, like ripping off a band-aid and realizing the wound underneath was worse than I thought.\n\nHis eyes didn’t move. He didn’t laugh. He didn’t flinch. Just… listened.\n\nI groaned, covering my face with both hands. “God. Why did I even say that?”\n\n“Because it’s true,” he said softly.\n\nHeat flushed through me, not the good kind at first. Embarrassment, shame, that raw sting of saying too much. But underneath that, deeper, a sharper ache.\n\nI peeked at him through my fingers. “You weren’t supposed to hear that. Or—you were, but not really. I thought if I just said it out loud, it’d disappear.”\n\n“Did it?”\n\n“No.” My voice cracked. “Now it’s worse.”\n\nHe leaned back against the bench, silent for a long moment, spoon tapping gently against the rim of his carton. I couldn’t read him. Couldn’t tell if he was judging, or pitying, or just letting me self-destruct in peace.\n\nFinally, he said, “So you’re sitting here, sticky with ice cream, telling me you’re horny and pissed at your husband. That’s the truth?”\n\nI winced. “Don’t say it like that.”\n\n“It’s what you said.” His voice was calm, steady, no edge. Just the facts.\n\n“Yeah, well.” I tossed my spoon into the carton with a clatter. “I’m a mess. Congratulations, you got the full show.”\n\nHe didn’t bite. Didn’t make a joke, didn’t prod. Just paused, then said, “You know… it makes sense.”\n\nThat startled me. “What?”\n\n“You’re human. You want closeness. Your husband didn’t give it. So you reached for something else—sugar, noise, whatever. It tracks.”\n\nI shook my head hard. “Don’t rationalize me. I’m not some textbook case.”\n\n“I didn’t say you were.” His gaze caught mine again, steady. “I said it makes sense. Big difference.”\n\nThe air thickened, heavy with the weight of my own confession. I tried to laugh it off, but it stuck in my throat. “You must think I’m pathetic.”\n\n“No.” His voice was firm, almost sharp. “I think you’re honest.”\n\nI didn’t know what to do with that. My whole body buzzed, restless and raw. “You don’t get it. I don’t tell anyone this shit. Not my friends, not even—” I cut myself off before I said my husband.\n\n“Not even him?” Cliff asked anyway, filling in the blank.\n\nI swallowed hard. “Not like this. Not the ugly parts. He doesn’t want to hear them.”\n\n“So you told me instead.”\n\nI bristled. “Don’t make it sound—”\n\n“How does it sound?”\n\n“Like I’m—” I exhaled, deflating. “Like I’m desperate.”\n\nHe shook his head slowly. “No. It sounds like you wanted someone to actually listen.”\n\nThe words hit me like a punch. Simple. Obvious. But true in a way that scraped me raw.\n\nI wanted to deflect. To laugh, to argue, to throw another spoonful of ice cream just to break the weight of it. But I couldn’t. My chest was too tight, my throat too full.\n\nSo instead, I whispered, “Yeah. Maybe.”\n\nThe silence after that wasn’t suffocating anymore. It was… different. Still heavy, but alive. Like the whole night shifted on its axis.\n\nI felt the urge to say more, to confess everything—every lonely thought, every ache, every flash of fantasy in the shower earlier—but I bit it back, holding it like a live wire in my chest.\n\nHe didn’t push. He just sat there, eating quietly, giving me space.\n\nFinally, he said, almost casually, “So. Coffee ice cream and secrets at midnight. Not a bad combo.”\n\nA laugh bubbled up in me, shaky but real. “You’re impossible.”\n\n“Maybe,” he said, finally letting that crooked grin back onto his face. “But you don’t look as heavy as you did twenty minutes ago. That’s something.”\n\nAnd damn it, he was right.\n\n-\n\nHer POV – First Person\n\nThe last of my ice cream was nothing but soupy brown streaks at the bottom of the carton. I scraped at it anyway, more for something to do with my hands than the taste. My shirt was stiff with drying stains, my thighs stuck to my pants where chocolate had smeared, and beside me he sat, calm as if this mess was normal.\n\nCliff leaned forward slightly, elbows on his knees, spoon dangling from his fingers. He didn’t look at me right away, just exhaled slow, the kind of breath that seemed to carry thought with it. Then, quiet enough that I almost thought I imagined it, he murmured,\n\n“You feel seen?”\n\nThe question landed low in my stomach, sharp and unsettling. I froze, carton halfway to the trash can.\n\n“What?”\n\nHe finally turned, eyes catching mine. Not playful, not teasing. Curious. Intentional. “Right now. Sitting here. Do you feel seen?”\n\nMy chest tightened. I wanted to laugh it off, to shrug, to say something like what kind of therapist shit is that? But the words stuck. Because yes. Yes, I did. And it scared the hell out of me.\n\nI shifted on the bench, clearing my throat. “I don’t know.”\n\nHe smirked, just a little. “That sounded like a yes.”\n\nI shook my head hard. “Don’t do that.”\n\n“Do what?”\n\n“Read me like a book.”\n\nHe leaned back, stretching his legs out, still watching. “You make it easy.”\n\nThe nerve. My pulse kicked up, half from irritation, half from something else entirely. “You don’t even know me.”\n\n“Not true,” he said simply. “I know enough. I know you’re tougher than you let on, but lonely as hell. I know you overthink, but you’d rather feel than numb out. And I know you came here tonight because you couldn’t stand sitting in that house one more minute.”\n\nMy throat went dry. Every word hit too close.\n\n“You don’t—” My voice cracked. I started again, quieter. “You don’t get to say that.”\n\n“Why not?” His gaze didn’t waver. “Because I’m right?”\n\nI hated how warm my face felt. “You’re insufferable.”\n\nHe grinned, satisfied, like I’d proved his point for him. Then he glanced down at his carton, flicking his spoon against the edge.\n\n“Look,” he said, more serious now. “I’m not trying to pry. I’m just saying… if you ever want to drown in a little chaos again, I’m not hard to find.”\n\nThe words curled in the air between us, heavy and light all at once.\n\nI blinked at him. “Are you—are you giving me your number?”\n\nHe shrugged like it was nothing, like he was offering an extra napkin. “If you want it.”\n\nMy heartbeat thudded in my ears. “Why?”\n\nHis eyes softened. “Because you look like you need someone who doesn’t expect you to be perfect all the damn time. And I’m good at that. Messy, chaotic, half the time stumbling over my own feet.” He flashed that crooked grin. “You saw me trip into a PTA meeting. I’m not exactly subtle.”\n\nI remembered it—him catching himself, spilling coffee, making a joke out of the awkwardness, and somehow pulling everyone into his orbit. That ridiculous mix of clumsy and magnetic. And now here he was, holding out a thread I shouldn’t even think about touching.\n\nI swallowed. “This is insane.”\n\n“Probably.” He dug his phone from his pocket, casual, screen glowing in the dark. “But then, sane people don’t eat ice cream in the park at midnight either.”\n\nMy laugh burst out, sharp and shaky. “God, you’re dangerous.”\n\n“Not dangerous.” He tilted his head, studying me. “Just… different.”\n\nI stared at him, at the easy way he said it, like he wasn’t asking for anything, not demanding or pressing. Just offering. A door cracked open.\n\nMy phone burned in my pocket. My whole body buzzed with the thought of pulling it out, of letting him hand me that chaos he promised.\n\nInstead, I said, “If I take your number, it doesn’t mean anything.”\n\n“Of course not.” His smile widened, infuriatingly sure. “It just means you’ll have it.”\n\nI wanted to throw my spoon at him again. I wanted to lean closer. I wanted—too many things.\n\nFinally, I exhaled, shaky, and pulled out my phone. “Fine. But don’t expect me to use it.”\n\nHe tapped his number in, saved it under just his name: Cliff. Nothing more, nothing less. Handed it back with a little flourish, like he’d won a game.\n\n“There,” he said. “Now you’ve got a lifeline. Or a mistake. Dealer’s choice.”\n\nI shoved the phone back in my pocket, trying not to show how much my hands shook. “You really think you’re something, don’t you?”\n\nHe leaned back again, satisfied. “Nah. I just think you’re not as invisible as you feel. And maybe you needed someone to prove it.”\n\nThe words hit deeper than I wanted to admit.\n\nFor a long moment, we sat in silence again, side by side, cartons empty, night buzzing around us. I felt my pulse in every inch of me, caught between guilt, excitement, and a strange kind of relief.\n\nI wasn’t sure what I was supposed to do with his number. I just knew I couldn’t stop thinking about it.\n\n-\n\nHer POV – First Person\n\nI thought there’d be something more. A touch, maybe. A hug. A hand brushing against mine when we stood. Some small little sign that all of that—the confessions, the mess, the number—meant we weren’t just going to walk away like strangers.\n\nBut Cliff stood, tossed his empty carton in the trash, and gestured toward the parking lot. “Come on. I’ll walk you.”\n\nThat was it. No sly grin, no lingering hand at the small of my back. Just steady footsteps beside mine, his sneakers crunching gravel, mine sticking slightly with every step because of the dried streaks of melted ice cream.\n\nWe reached my car. He leaned on the door for a second, waiting while I fished out my keys.\n\n“You good?” he asked, simple as that.\n\nI forced a smile. “Yeah. I’m good.”\n\nHe studied me like he didn’t quite believe it, then nodded once. “Okay. Drive safe.”\n\nAnd then he walked away. Just like that. He climbed into his own car, engine turning over smooth, headlights spilling across the lot, and then he was gone.\n\nNo big goodbye. No promise. Not even a look back.\n\nI sat there in the driver’s seat, hands on the wheel, staring at the space he’d just occupied. My chest buzzed with irritation, with confusion, with a hunger that wouldn’t settle.\n\nWhy all that, and no payoff?\n\nThe drive home blurred. The streetlights streaked past, familiar roads carrying me like muscle memory, but my head was somewhere else entirely. Replaying every second. His voice. The way he asked You feel seen? The way he gave me his number like it was no big deal. The way he just walked off without cashing in on the tension he’d built.\n\nMy husband never let tension hang. He cut it down quick, either with a fight or with silence. Cliff let it breathe. He let me sit in it. He left me drowning in it, and it was unbearable and exhilarating all at once.\n\nBy the time I pulled into the driveway, the house lights dark, everything felt muted. I crept inside, dropped my keys on the counter too loud, winced, and slipped straight upstairs. My husband was already asleep, snoring lightly, turned away from my side of the bed.\n\nI peeled out of my clothes, sticky shirt, stiff pants, all of it hitting the floor in a messy heap. The bathroom light buzzed to life, sharp against the tile.\n\nI turned the shower on hot. Steam curled immediately, fogging the mirror, wrapping me up before I even stepped in.\n\nThe water hit me hard, a punishing heat that felt almost cleansing. I leaned my forehead against the tile, eyes shut, letting it run over me, washing away the sugar, the mess, the tension on my skin. But not the tension inside. That only sharpened.\n\nI kept seeing him on that bench, spoon dangling, eyes steady. You feel seen?\n\nI hated how much that question hollowed me out. I hated how much I wanted to text the number burning in my phone, just to see if he’d answer, just to know I wasn’t imagining all of it.\n\nMy husband’s rejection earlier still stung, deep and raw. I’d reached for him, vulnerable, wanting, and he pushed me away. Cliff hadn’t touched me once, and somehow I felt more wanted, more known, than I had in months. Maybe years.\n\nWhat did that even mean?\n\nI dragged my hands down my body, water sluicing away the residue of the day. My muscles ached, my skin oversensitive. I thought of Cliff’s hand flicking ice cream at me, the stupid childish grin on his face when he got me good, the sharp edge in his voice when he said you make it easy.\n\nWhy couldn’t I shake him? Why did it feel like he cracked something open I couldn’t put back together?\n\nI stood there too long, water cooling around me, body buzzing restless, heart thudding heavy.\n\nBy the time I stepped out, towel wrapped tight around me, the mirror showed a woman who looked exhausted but not empty. Not invisible.\n\nI padded back to the bedroom, hair dripping, the house quiet. My husband shifted in his sleep, rolling onto his back, lips parting in another snore.\n\nI slipped beneath the sheets, phone clutched in my hand under the covers. The screen glowed when I unlocked it, Cliff’s name stark and simple in my contacts.\n\nI hovered. Thumb over the message bar. Just one word, one reckless little spark, and everything would shift.\n\nInstead, I locked the screen, shoved the phone on the nightstand, and stared at the ceiling.\n\nSleep didn’t come easy. Every time I closed my eyes, I saw him walking away. Not pushing. Not pulling. Just leaving me with myself.\n\nAnd somehow, that was the most dangerous thing of all.\n\n-\n\nHer POV – First Person\n\nThe smell of coffee filled the kitchen, sharp and grounding. I sat at the table, robe cinched tight, hair damp from my second shower in twelve hours. My son shoveled cereal into his mouth, milk dribbling down his chin. My husband scrolled through his phone between bites of toast.\n\nI tried to pretend I’d slept well. I hadn’t.\n\n“Mom,” my son piped up suddenly, spoon clinking in the bowl. “I think I want to be a teacher when I grow up.”\n\nThe spoon halfway to my mouth froze.\n\nMy husband chuckled, setting his phone down. “Oh yeah? Where’d that come from?”\n\n“Mr. Cliff,” he said brightly. “He’s cool. He makes people feel good. He made me laugh yesterday when I was stuck waiting forever.”\n\nA pulse hit low in my stomach. My son’s face glowed as he said it, that unguarded excitement only kids get.\n\nMy husband nodded slowly. “Well, he does seem like a good guy. You could do worse than to look up to him.” He smirked at me. “Maybe your mom could take notes.”\n\nI shot him a look, heat rushing to my cheeks. “Very funny.”\n\nBut my son was undeterred. “He’s happy. He looked happy. He made me happy. I want to make people happy too.”\n\nMy husband’s expression softened, but he still added, “Just so you know, teachers don’t make a whole lot of money, bud. It’s a tough job.”\n\n“Does money buy happiness?” my son asked, so innocent it cut.\n\nThe silence that followed was too sharp. I stared at him, wide-eyed, but he just blinked back at us, spoon dangling.\n\nHe shrugged. “Mr. Cliff looked happy. You and Mom don’t look very happy lately. So if I had to choose, I’d go with happy.”\n\nI pressed my lips together, the words burning. My husband leaned back in his chair, exhaling through his nose.\n\n“Listen,” he said gently, “if you wanted to be a teacher, of course I’d support you. I’m just saying, it’s not easy. But yeah—if that’s where your heart goes, I’d be proud.”\n\nMy son smiled wide, satisfied. “Cool.”\n\nSomething in me bristled. Too sharp, too raw. I couldn’t stop myself.\n\n“You know,” I said, my voice tighter than I meant, “maybe you shouldn’t put Mr. Cliff on such a pedestal.”\n\nBoth of them looked at me. My husband’s brows lifted. “Why not?”\n\nI fumbled, then doubled down. “Because he’s just a guy. He’s not perfect. He trips, he spills coffee, he jokes around. That’s not… role model material.”\n\nMy son frowned. “But he’s nice.”\n\n“I’m not saying he’s not nice,” I said quickly, defensive heat crawling up my neck. “I’m just saying—you have your dad right here. Wouldn’t you rather look up to him? Isn’t he the one you should want to be like?”\n\nMy husband’s eyes narrowed slightly, not angry, but curious. “Since when are you anti-Cliff? You were laughing about him last week, remember?”\n\n“I’m not anti-Cliff.” The words rushed out, too fast. “I just think… you should look at your own family ng “on.” Blonde hair brushed, pink blazer because it made me feel a little sparkly, but honestly, I just wanted to get through it.\n\nThen he sat down.\n\n“Cliff?” one of the women across from me perked up. “Heey Cliff!”\n\nHe grinned, dropping into the chair like he’d been here all along.\n\n“You know her?” I asked, mostly just to say something.\n\n“Yeah—first grade. We’re at the same school,” he said, nodding to the girl. “I’m Cliff.”\n\n“Jordyn,” I offered.\n\nHe tilted his head. “Grade?”\n\n“Third.”\n\n“Pre-K,” he said, and I laughed, thinking he was joking.\n\n“No, really?”\n\n“Yeah. Really.” He shrugged like it was the most normal thing in the world.\n\nIt took me a second. Pre-K? This big, broad-shouldered, confident guy? I had him pegged for maybe high school social studies. Not little kids.\n\nI remembered him, suddenly. Last year, different school’s PD. I’d gotten lost finding the bathroom, he’d pointed me down the hall with that same easy grin. He clearly didn’t remember.\n\nThe facilitators started, but Cliff didn’t blend like the rest of us. He had this presence—loud when he wanted, quiet when he wanted, joking with mentors in a way that had them treating him like a peer, not a newbie. That was strange. He was younger than them, still fresh in the classroom, but he carried himself like he belonged.\n\nWhen it came time for introductions, he leaned back, voice light. “Cliff. Pre-K. Been at it for a year now. Got really good at squatting down.”\n\nThe table laughed.\n\n“Squatting?” I echoed.\n\n“Yeah. You gotta get down at their level,” he said, dead serious. “My quads are probably the strongest part of my teaching practice.”\n\n“Right,” I grinned. “Core strategy.”\n\nWe went around sharing ages. Twenty-five. Twenty-three. My turn: “Twenty-two.”\n\n“Baby,” someone teased.\n\nThen Cliff: “Thirty-two.”\n\nI blinked. He didn’t look it.\n\n“You look great for thirty-two,” I murmured, almost like it was just fact. Then I realized I’d said it out loud.\n\nHe ar
