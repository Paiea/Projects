const BOOKS=[{"id":"tracy","label":"BOOK 1","name":"Tracy","state":"CURRENT DRAFT","ready":true,"facts":["53","Teacher","Married","Two children","Coworkers","21-year age gap"],"hook":"She has spent years becoming the person everyone can depend on. Then her younger coteacher starts listening closely enough that being competent stops feeling like the same thing as being seen.","intro":["Tracy has built a real adult life. Marriage, children, work, routines, responsibilities. She is good at what she does, and people trust her to keep things moving.","Cliff is her younger coteacher: large, chaotic, funny, unexpectedly observant, and very good at giving other people the stage.","Nothing dramatic happens at first. He listens. He remembers. He notices. Then Tracy starts noticing that she likes being noticed, and eventually that she has started looking back."],"signals":"Adult fiction · older woman / younger man · coworkers · marriage pressure · slow burn → high heat"},{"id":"kristina","label":"BOOK 2","name":"Kristina","state":"RECOVERED DRAFT · READABLE","ready":true,"facts":["Adult","Teacher","Sobriety pressure","Sharp first-person voice"],"hook":"Kristina is very good at leaving first, joking first, and making sure nobody gets enough access to disappoint her. Unfortunately, Cliff keeps noticing the part she is trying to hide.","intro":["Kristina is funny when she is uncomfortable, sharp when she feels exposed, and more vulnerable than she wants anyone to notice.","Her surviving draft already has its own engine: new-teacher strain, sobriety and relapse pressure, ghosting, resentment, jealousy around Tracy, and the humiliating problem of Cliff continuing to care after she has tried to disappear.","A roughly 15,000-word full source survives. This reader serves that recovered draft directly while normalization remains editorial work."],"signals":"Adult fiction · recovery themes · jealousy · emotional volatility · slow escalation → high heat"},{"id":"alyssa","label":"RECOVERED LANE","name":"Alyssa","state":"MANUSCRIPT HUNT","ready":false,"facts":["Adult","Single mother","Twins","Nurse","Former model","Parent / teacher proximity"],"hook":"Her life is already full before Cliff enters it. The dangerous part is that he first becomes interesting by fitting naturally into the part of her life that is hardest to carry.","intro":["The pre-relationship fiction seed survives: a single mother of twins, a nurse and former model, watching one of her children attach strongly to Cliff at school.","The attraction engine is different from Tracy's. Cliff is not first valuable because he makes her feel younger or more visible. He becomes difficult to ignore because she sees competence, warmth, and adult steadiness inside the chaos she already lives in.","Later archive evidence proves an Alyssa story was written before the real relationship. The clean old manuscript has not yet been recovered, so this lane stays protected from later real-life history."],"signals":"Adult fiction · single mother · nurse · teacher/parent taboo · competence-as-attraction · high-heat direction"},{"id":"mel","label":"RECOVERED LANE","name":"Mel","state":"RECOVERED DRAFT · READABLE","ready":true,"facts":["Adult","Parent","Military spouse","Deployment pressure"],"hook":"Mel is already carrying the house, the family, and the waiting. Cliff becomes dangerous when helping her does not make her feel helpless.","intro":["Mel's strongest surviving source is a revised v8 manuscript of roughly 14,600 words.","Her pressure is not Tracy's invisibility or Kristina's self-sabotage. It is competence under deployment, exhaustion, parenting, and the strange relief of being helped without being reduced to a problem that needs solving.","The revised v8 source is readable here now. Chronology and continuity review can happen without blocking the manuscript."],"signals":"Adult fiction · military spouse · parent life · deployment · exhaustion · forbidden relief"},{"id":"pta-mom","label":"RECOVERED LANE","name":"PTA Mom","state":"RECOVERED COMPILATION · READABLE","ready":true,"facts":["Adult","Parent","Married","PTA / school-community proximity"],"hook":"Nothing is catastrophically wrong with her life. That is exactly why feeling abruptly alive around Cliff is so inconvenient.","intro":["A roughly 23,900-word compilation survives for an unnamed PTA-mother POV.","Her marriage is functioning and safe. Her life is contained rather than ruined. Cliff first registers by waking up a dead room, then becomes a private contrast to how predictable everything else has become.","The surviving compilation is readable here now. It may contain duplicate or overlapping revision material, which remains an editorial cleanup problem rather than a reader lock."],"signals":"Adult fiction · PTA mom · functioning marriage · boredom/aliveness · parent/teacher taboo"},{"id":"jordy","label":"RECOVERED LANE","name":"Jordy","state":"RECOVERED PARTS · READABLE","ready":true,"facts":["22","New teacher","Has a boyfriend","Different school","District orientation"],"hook":"Jordy is new, young, bright, and still half living in the momentum of college. Cliff is older enough to feel grounded without feeling old, which makes him a very different kind of problem.","intro":["Jordyn, usually Jordy, is explicitly twenty-two and meets Cliff at district new-teacher orientation rather than in his classroom or school.","She has a college boyfriend and is new to the area. Her engine is youth, novelty, sparkle, and the contrast between people her own age and Cliff's more settled professional energy.","The substantial surviving parts are assembled here in recovered part order. No claim is made that this is a final normalized edition."],"signals":"Adult fiction · 22/32 age gap · new teachers · different schools · boyfriend · novelty / groundedness contrast"}];
const STORIES={"tracy":"\n\nCliff was not listening to me.\n\nI knew this because he was standing at the supply counter with his back half-turned, uncapping a blue marker with his teeth while trying to tape a torn label back onto the block bin.\n\nNobody listening to another adult should be doing three things at once.\n\nEspecially not Cliff.\n\nCliff doing three things at once usually meant one of them was about to become four things and at least one object would disappear forever.\n\n“So after snack,” I said anyway, “I was thinking we could leave the story table open instead of breaking it down.”\n\n“Mm-hm.”\n\nThat was not encouraging.\n\nI kept going.\n\n“The kids could draw one piece from the story in the morning, and then after lunch we put the drawings out with the puppets. Let them retell it however they want. We can photograph whatever they build and use that for the family board.”\n\nCliff pressed the label flat with the side of his fist.\n\n“Mm.”\n\nI looked at the back of his head.\n\nThere were times when working with Cliff was very much like working beside an enthusiastic golden retriever who had somehow passed a background check.\n\n“Never mind,” I said.\n\nHe turned.\n\n“What?”\n\n“Nothing.”\n\n“No, you said never mind.”\n\n“You’re busy.”\n\n“I’m labeling.”\n\n“You’re chewing a marker.”\n\nHe took it out of his mouth and looked at it as though this information had surprised him.\n\n“I was not chewing it.”\n\n“There are teeth marks.”\n\n“Circumstantial.”\n\nI laughed despite myself and reached for the stack of paper beside me.\n\n“It’s fine. I can figure it out.”\n\nCliff stared at me for a second.\n\nThen he pointed the blue marker at the story table.\n\n“No, I like it.”\n\nI looked up.\n\nHe went on.\n\n“The drawings become the props, right? So we’re not making some whole new teacher-created setup they’re supposed to care about.”\n\nI stopped moving.\n\n“And if we take pictures while they’re retelling,” he said, “then the family board isn’t us pretending we know what the important part was. It’s literally whatever they chose.”\n\nI said nothing.\n\nCliff frowned.\n\n“What?”\n\n“You were listening.”\n\nHe blinked.\n\n“Yeah.”\n\n“You were fixing the bin.”\n\n“I can do two things.”\n\n“You were doing at least four.”\n\nHe looked down at the tape in one hand and the marker in the other.\n\n“Okay, that’s fair.”\n\nThen he nodded toward the table again.\n\n“Do it. I think it’s good.”\n\nThat should have been the end of it.\n\nA coworker listened while I talked.\n\nCongratulations to him.\n\nPut it on a fucking certificate.\n\nExcept something in me had already prepared for the other version.\n\nThe version where I finished talking, realized I had been talking mostly to myself, and quietly took care of it because that was easier than asking anybody to come back and hear me properly.\n\nInstead Cliff had been listening so closely he had caught the part I had not even been sure was the point.\n\nI looked down at his hand.\n\nThere was blue marker across the side of his thumb.\n\nNot a lot.\n\nJust a crooked smear where he had apparently missed the label and colored himself instead.\n\nFor some reason, that was what stayed.\n\nNot what he said.\n\nNot even the surprise of being heard.\n\nBlue marker.\n\nHis thumb.\n\nRidiculous.\n\n“Tracy?”\n\nI looked up.\n\n“What?”\n\n“You just went somewhere.”\n\n“I’m standing right here.”\n\n“Physically.”\n\n“Go finish destroying that marker.”\n\nHe grinned.\n\n“Yes, ma’am.”\n\nThat was Tuesday.\n\nBy Wednesday morning I had forgotten the entire thing.\n\nMostly.\n\nI had a husband, two children who were technically old enough to stop needing me every six minutes and had declined the opportunity, nineteen small humans who definitely were not, and a classroom that produced mess at a rate I considered scientifically impossible.\n\nI did not have time to be emotionally affected by office supplies.\n\nAt 7:19, the classroom door opened.\n\nCliff came in looking like death had gotten bored halfway through killing him.\n\n“Morning,” he said.\n\nI looked at the clock.\n\n“Cutting it close.”\n\nHe stopped.\n\nNot actually late.\n\nThat was the annoying part.\n\nCliff normally arrived early enough that I had apparently developed the entitlement to interpret 7:19 as a personal betrayal.\n\nHe let his backpack slide off one shoulder and onto the floor.\n\n“Mm-hm.”\n\nHis hair was damp. His shirt was wrinkled at the collar. He looked down at the coffee in his hand like he had recently learned it existed.\n\n“You okay?”\n\n“Yeah.”\n\nHe opened a cabinet.\n\nThen just stood there.\n\n“Cliff.”\n\n“Mm?”\n\n“You sure?”\n\nHe closed his eyes.\n\nRubbed both hands down his face.\n\nSlowly.\n\nHis shoulders dropped with them.\n\nIt lasted maybe three seconds.\n\nThat was all.\n\nThree seconds of a man I had worked beside for months apparently forgetting to be funny.\n\nThen he exhaled.\n\n“Actually?”\n\n“What?”\n\n“I’m fucking exhausted.”\n\nI laughed.\n\nHe opened one eye.\n\n“No, seriously. I stood in my kitchen this morning holding my coffee and looking for my coffee.”\n\n“It was in your hand?”\n\n“For an uncomfortable amount of time.”\n\n“That’s impressive.”\n\n“Thank you.”\n\nThere.\n\nCliff again.\n\nThe room settled back into place.\n\nI turned to the tables and went back to setting out materials.\n\nHe moved behind me, pulling bins from the cabinet.\n\n“Hey.”\n\n“What?”\n\n“Thanks for doing this.”\n\nI looked at the trays.\n\n“It needed to get done.”\n\n“I know.”\n\nHe kept walking.\n\nThen, without changing his pace:\n\n“You always make mornings easier.”\n\nMy hand stopped over a cup of pencils.\n\nCliff did not stop.\n\nThat mattered.\n\nHe did not turn around to see if the line worked.\n\nHe did not lower his voice.\n\nHe did not smile at me like he had just said something clever.\n\nHe simply said it because, apparently, he thought it.\n\nYou always make mornings easier.\n\nI put the pencil in the cup.\n\nThen another.\n\nThen I realized I had put the same pencil in twice because I was still holding it.\n\n“For fuck’s sake,” I muttered.\n\n“What?” Cliff called from the other side of the room.\n\n“Nothing.”\n\n“That sounded like something.”\n\n“Do your job.”\n\n“Hostile work environment.”\n\nChildren arrived twelve minutes later and saved me from thinking about any of it.\n\nThat was one of the useful things about teaching small children.\n\nThere was only so long an adult could contemplate the meaning of a sentence before someone announced that their sock felt wrong.\n\nBy eight-thirty, one child had cried because another child owned a shirt with a dinosaur on it, somebody had hidden a plastic carrot inside a dollhouse toilet, and Cliff had somehow acquired a sticker on the back of his neck without noticing.\n\nNormal.\n\nGood.\n\nI preferred normal.\n\nAt the story table, the idea from Tuesday worked better than I had expected.\n\nThe kids ignored the actual plot almost immediately, which meant they understood the assignment perfectly.\n\nA paper wolf became somebody’s grandmother. A yellow scribble became a volcano. One of the puppets spent ten minutes trapped beneath a wooden taco.\n\nCliff sat on a chair designed for a person approximately one-third his size, knees up near his chest, listening to a little girl explain why the wolf had to go to space.\n\n“No way,” he said.\n\nShe nodded with complete seriousness.\n\n“A purple spaceship?”\n\nAnother nod.\n\nHe leaned forward.\n\n“That changes everything.”\n\nI smiled before I could stop myself.\n\nHe did that.\n\nGave people the stage.\n\nChildren, parents, staff. Me.\n\nIf somebody was talking and Cliff cared, he did not just wait for the noise to stop so he could speak again.\n\nHe reacted.\n\nAsked questions.\n\nRemembered pieces later.\n\nMade the person talking feel like the interesting part of the room.\n\nI had known that about him for months.\n\nSo why had I only started noticing that I knew it?\n\nThat question irritated me enough that I went to find scissors.\n\n“Tracy.”\n\nI ignored him.\n\n“Tracy.”\n\n“What?”\n\n“Where are the good scissors?”\n\nI looked over.\n\nHe was standing by the supply cabinet, opening and closing drawers with the confidence of a man who expected objects to reorganize themselves around his needs.\n\n“You lost them.”\n\n“I reject the premise.”\n\n“You were holding them yesterday.”\n\n“That sounds circumstantial.”\n\n“They’re in the second drawer.”\n\n“I checked.”\n\n“No, you looked.”\n\n“Same thing.”\n\n“It absolutely is not.”\n\nI walked over.\n\nCliff stepped sideways.\n\nNot quite enough.\n\nMy arm brushed his when I reached past him.\n\nFabric against fabric.\n\nNothing.\n\nI opened the second drawer and pulled out the scissors sitting directly on top.\n\nHe stared at them.\n\nThen at me.\n\n“How the fuck did you do that?”\n\n“They’re where they always are.”\n\n“Witchcraft.”\n\nI held them out.\n\nHis fingers closed over the handles at the same time mine released.\n\nOne of his fingers touched the side of mine.\n\nAgain, nothing.\n\nA completely ordinary exchange of classroom equipment between two adults who had transferred objects between them hundreds of times.\n\n“Thanks,” he said.\n\n“Try remembering where they live.”\n\n“No promises.”\n\nHe walked away.\n\nI stayed beside the cabinet.\n\nOne second.\n\nMaybe two.\n\nThen I looked down at my hand.\n\nAbsolutely fucking ridiculous.\n\nI spent the rest of the day proving to myself that it was ridiculous.\n\nWhich mostly meant noticing Cliff far more often than I would have if I had simply left the thought alone.\n\nHis laugh from the other side of the room.\n\nThe way he looked toward me whenever one of the kids said something insane, like I was the person he wanted to make sure had heard it too.\n\nThe blue marker still faintly visible on his thumb.\n\nThat last one pissed me off.\n\nBecause I had not gone looking for it.\n\nI had simply seen his hand while he was helping a child tape two pieces of paper together.\n\nBlue.\n\nStill there.\n\nMy stupid brain recognized it before I had consciously registered his hand.\n\nAt home that night, Kirt was standing in the kitchen in running shorts, eating chicken directly out of the container.\n\nI put my bag down.\n\n“Plate?”\n\nHe looked at the fork in his hand.\n\n“This is a plate.”\n\n“That is Tupperware.”\n\n“Portable plate.”\n\nTwenty-four years of marriage had not improved either of us.\n\nI opened the refrigerator.\n\n“How was school?” he asked.\n\n“Fine.”\n\n“Just fine?”\n\n“One kid put a carrot in a toilet.”\n\nHe stopped chewing.\n\n“Real toilet?”\n\n“Dollhouse.”\n\n“Okay. Less interesting.”\n\n“I disagree.”\n\nHe smiled.\n\nThere was nothing wrong with the smile.\n\nNothing wrong with him.\n\nThat was important too.\n\nKirt was not a monster waiting at home so I could feel noble for noticing another man.\n\nHe was my husband.\n\nHe knew which side of the bed I slept on. He knew I hated the sound of forks scraping ceramic. He knew which cereal I bought when I was sick and which one I bought when I was pretending I was going to eat healthier.\n\nHe also knew how to irritate me with six completely reasonable words.\n\n“You going to the gym tomorrow?”\n\nI closed the refrigerator.\n\n“Maybe.”\n\n“You haven’t gone much this week.”\n\n“I know.”\n\nHe nodded.\n\nNo accusation.\n\nNo insult.\n\nJust information.\n\n“You were getting into a good rhythm.”\n\nThere it was.\n\nI hated that sentence.\n\nNot because he meant anything cruel by it.\n\nHe didn’t.\n\nKirt liked systems. Progress. Numbers. The satisfaction of doing something three times a week and being able to point at the result.\n\nHe liked the gym because the gym made sense.\n\nPut in work. Improve.\n\nI had liked that too once.\n\nSometimes I still did.\n\nBut there were nights when his attention landed on me and I could almost feel the invisible clipboard in his hand.\n\nHow are we doing?\n\nWhat could improve?\n\nWhat slipped this week?\n\nHe never said any of that.\n\nThat was just with the volume low.\n\nHe looked up when I came in.\n\n“There you are.”\n\nMy entire body reacted to the phrase before my brain could separate him from Cliff.\n\nI hated that.\n\n“Hey.”\n\n“You eat?”\n\n“Yes.”\n\nTrue.\n\nNot dinner.\n\nStill true.\n\n“How late were you working?”\n\nI put my bag down.\n\n“Too late.”\n\nAlso true.\n\nKirt stood and stretched.\n\n“You look tired.”\n\n“I am.”\n\nHe kissed my forehead.\n\nSame as when I had been sick.\n\nFamiliar.\n\nWarm.\n\nMy throat tightened.\n\n“Come to bed,” he said.\n\n“In a minute.”\n\n“You okay?”\n\nI nearly laughed at the cruelty of the universe.\n\n“Yeah.”\n\nHe went upstairs.\n\nI stood alone in the kitchen.\n\nMy phone buzzed.\n\nCliff:\n\nHome?\n\nI stared at the screen.\n\nThen toward the staircase.\n\nMe:\n\nHome.\n\nCliff:\n\nOkay.\n\nI put the phone facedown.\n\nFor the first time all week, I did not want another message.\n\nNot because I wanted less of Cliff.\n\nBecause there was finally too much to hold at once.\n\nThe next morning, the classroom looked offensively normal.\n\nSame tables.\n\nSame bins.\n\nSame tiny chairs.\n\nSame story table.\n\nI arrived first.\n\nAt 7:13, the door opened.\n\nCliff walked in.\n\nHe looked at me.\n\nI looked at him.\n\nNeither of us smiled.\n\nThen he held up a roll of masking tape.\n\n“Found it.”\n\nI laughed so suddenly I had to turn away.\n\nOf course.\n\nTape.\n\nThe stupidest possible object.\n\n“What?” he asked.\n\n“Nothing.”\n\n“You’re laughing.”\n\n“I’m aware.”\n\nHe set the tape on the table.\n\nThree feet away.\n\nMaybe less.\n\nThe distance meant something completely different now.\n\nA child arrived ten minutes later and immediately needed help with a zipper.\n\nCliff crouched.\n\nListened.\n\nAsked a question.\n\nGave the child the stage like he always had.\n\nNothing about him had changed.\n\nThat was the problem.\n\nOr maybe the point.\n\nI had spent days waiting for ordinary life to split open and reveal what was underneath.\n\nIt never did.\n\nOrdinary life stayed exactly where it was.\n\nWe were the ones who had put something underneath it.\n\nAt 9:22, one of the kids said something ridiculous.\n\nCliff looked across the room for me automatically.\n\nOur eyes met.\n\nThe same old habit.\n\nOnly now I knew what else those eyes had seen.\n\nI knew what his hands felt like when they were not passing me scissors.\n\nI knew what three feet could become.\n\nCliff’s mouth twitched.\n\nBarely.\n\nI looked back at the child before anybody could notice.\n\n“Okay,” I said, because apparently that word was carrying a lot now too.\n\nThe day kept moving.\n\nIt had to.\n\nAnd that was how I knew I had actually fallen.\n\nNot because the world changed.\n\nBecause it didn’t.","kristina":"I hated the way the building felt after hours. The hum of the AC, the faint smell of crayons and Clorox wipes, the hollow echo of my own footsteps. Everyone else had gone home hours ago, but I was still here, hunched over my desk, rewriting plans that would probably get derailed by five-year-olds who didn’t give a damn. Kindergarten wasn’t supposed to feel this lonely.\n\nI told everyone I was happy—new classroom, new start, moving up from assistant to teacher. Big smile, perfect eyeliner, nails always done. I told Tracy last week it was going “so good.” She nodded and probably believed me. That’s the thing—I can play the part. Always have.\n\nBut under it? I was exhausted. Barely treading water.\n\nI used to have a built-in anchor last year. Cliff.\n\nGod, even thinking the name twisted something in my stomach.\n\nI’d never admit it out loud, but he was one of the only people who saw me. Not the smiley, flirty, “everything’s fine” version. Me. The girl who moved across the country to start over, who went to AA meetings every damn day just to make it through without wrecking herself. He’d catch those cracks in the mask and call me out without being cruel. He’d push me toward my real self, the one I didn’t even like being around.\n\nI hated that. I hated him for it.\n\nAnd I missed it.\n\nBut of course, I’d ruined that. Classic me. I’d ghost him for weeks, sometimes months. Pull back whenever he got too close. Let him in only when I needed someone and then slam the door shut after. He never pushed, never crossed lines, but he never stopped caring either. Until now.\n\nNow it was different. He’d congratulated me—twice—when I got my own classroom. I ghosted both messages. Couldn’t even type out a thanks. Some part of me didn’t want him to see me as struggling. Some part of me wanted to punish him for… what, being decent? For being ahead?\n\nBecause yeah, I was spiteful about it. He skipped the line. He got a classroom before me. I’d been grinding in education for a decade—subbing, assisting, clawing for any kind of recognition—and he waltzed in, first year full-time, bam, Pre-K lead. Like the system just bent to make room for him.\n\nIt wasn’t fair.\n\nAnd it made me want to tear my hair out that I couldn’t even hate him properly.\n\nBecause the kids adored him. The parents adored him. Hell, even the crustiest teachers in the lounge couldn’t help but light up when he walked in. He had this presence—big, grounded, playful in a way that didn’t feel forced. You wanted to follow him. You wanted to laugh with him. I’d seen it last year every damn day, and I’d felt it too.\n\nAnd now? Now I didn’t get any of that.\n\nI gathered my bag at 5:30, shoulders aching, eyes burning from staring at plans that probably weren’t even good. I pushed the classroom door open and froze.\n\nThere he was.\n\nCliff. Walking down the hall at the same time, backpack slung, that easy stride like the world didn’t weigh him down.\n\nI swear my chest actually tightened.\n\nWe both stopped. For a beat too long.\n\n“Still here?” he asked, voice casual. Not mean. Not warm either. Just… polite.\n\nI forced a smile. “Yeah. You too.”\n\n“Yeah. Too much to do.” He rubbed the back of his neck, glanced toward the exit.\n\nWe fell into step, walking down the empty hall. My heart hammered harder than it should have. I hated that he had this effect on me still, that just existing next to him made me feel seen, even when he wasn’t looking at me.\n\nHe didn’t ask about my day. Didn’t push. Just gave me a little nod, like we were acquaintances now. Nothing more.\n\nAnd it stung.\n\nBecause last year? He would’ve teased me. He would’ve made some dumb joke to get me out of my own head. He would’ve asked if I was okay and actually meant it.\n\nNow? I was just another coworker. One who’d burned the bridge he’d offered.\n\nWe stepped out into the fading light of the parking lot. He angled toward his moped—of course, the ridiculous little thing—and I caught myself watching the way his broad shoulders bent as he dug for his keys.\n\nHe didn’t even look back.\n\nI told myself I was relieved. That it was better this way. Cleaner. No more push, no more pull.\n\nBut walking to my car, I felt it. That hollow ache in my chest. That ugly mix of resentment and longing and shame.\n\nBecause I’d wanted him in my corner. And I’d shoved him out.\n\nAnd now he didn’t care enough to even try again.\n\nI hated that. I hated myself for that. And most of all—I hated that he still made me feel naked without saying a damn word.\n\n-\n\nFaculty meetings were always the same: too long, too loud, too pointless. A circle of half-dead teachers nodding at admin’s “big initiatives,” sipping coffee that had gone cold an hour ago. I usually sat in the back, perfected my neutral smile, and tuned most of it out. Survival mode.\n\nBut that day, I couldn’t tune out anything.\n\nBecause Cliff was there.\n\nAnd Tracy was there. Right next to him.\n\nI noticed them the second I walked in. How could I not? The energy was magnetic, almost obnoxiously so. She was lit up like someone had plugged her into a damn socket. Laughing, leaning in, her eyes sparkling in a way I had never—never—seen from her before.\n\nTracy. Sweet, soft-spoken, vanilla Tracy. The woman who used to fold like a paper doll when admin questioned her data. The one who always wore pastels and apologized for speaking too long. The one I’d worked under last year and thought I had completely figured out: nice, meek, predictable.\n\nExcept she wasn’t meek now.\n\nShe was alive. Playful. Teasing Cliff, tapping his arm like she was some giddy teenager. Her laugh carried across the room. And Cliff—God, Cliff—he was right there soaking it in, grinning at her like she was the only person in the room.\n\nI sat a few seats away, close enough to see every little thing, far enough that they didn’t have to notice me. And they didn’t. Of course they didn’t.\n\nTracy didn’t so much as glance my way. I could’ve been a ghost.\n\nI tried to focus on the principal talking about some new assessment tool, but my eyes kept dragging back to them. Cliff’s big frame leaned back, casual, commanding space without trying. Tracy leaned in close, like she couldn’t get enough of him. Her hand landed on his arm once, then again. And then—God, I swear—slid down toward his thigh.\n\nI blinked. Looked away. Looked back. Was she really doing that? Was I imagining it?\n\nNo. Her hand was there, resting too comfortably. Not a millimeter of hesitation in her body language. She was invested, glowing, hungry.\n\nAnd Cliff didn’t move it away.\n\nI felt my stomach twist. Anger? Jealousy? Maybe both, maybe neither. Whatever it was, it burned.\n\nBecause I remembered what it felt like when he invested in me. When his attention was on me, sharp and steady. When he noticed the cracks in my fake smile and gently, relentlessly, called them out. When he didn’t let me disappear behind “I’m fine.”\n\nAnd here he was, giving that energy to Tracy. To meek little pastel Tracy who suddenly looked like she’d found the fountain of youth.\n\nWhat the hell was that?\n\nI caught myself staring and forced my eyes down to my notes, scribbling nonsense just to look busy. But the sounds—their laughter, the low rumble of his voice—kept piercing through. Every little moment pressed on me like a bruise.\n\nDid she even know how lucky she was? Did she even know what it felt like to have him see you? Or was she just basking in it, no idea that she was holding something rare, something I’d thrown away without realizing what it cost?\n\nI wanted to believe it was harmless. That they were just colleagues, vibing over some shared joke about circle time or crayons. That I’d invented the way her hand lingered, the way her voice dropped softer when she spoke to him.\n\nBut deep down, I knew I hadn’t invented anything.\n\nI leaned back in my chair, crossing my arms, trying to look unbothered. Inside, I was spiraling.\n\nWhy her? Why now?\n\nTracy wasn’t… special. Not really. She was fine. Sweet. A good teacher. But she wasn’t the type to make people’s heads turn. She wasn’t the type to light up a room. And yet Cliff was leaning into her orbit like she’d been that all along. Like she’d been hiding this playful, magnetic side and he was the one who cracked it open.\n\nMaybe that was it.\n\nMaybe that’s what he did.\n\nHe cracked people open.\n\nHe’d done it to me. I hated him for it, hated him for seeing the raw, messy parts of me I worked so damn hard to bury. And now he was doing it to her. And she was letting him.\n\nAnd unlike me, she wasn’t pushing him away. She wasn’t ghosting him. She was leaning in, laughing harder, touching him like she had every right.\n\nI tapped my pen against my notebook, heartbeat too fast. If anyone looked at me, they’d just see a teacher zoning out, maybe a little restless. No one would guess the storm tearing through my chest.\n\nWhen the meeting finally ended, people stood and shuffled papers, stretched their legs. Cliff leaned down, said something to Tracy that made her laugh again, that same teenage sparkle lighting her face. She touched his arm once more, and I had to look away before the heat in my chest boiled over.\n\nI gathered my things quickly, too quickly, and slipped out without saying goodbye.\n\nIn the quiet of the hallway, I finally exhaled. My face burned.\n\nWhat the hell was wrong with me?\n\nI didn’t want him. Not really. Not anymore. That was last year. That was a mess I’d boxed up.\n\nSo why did it feel like the air had been sucked out of me the second Tracy touched his thigh?\n\nWhy did it feel like I was the invisible one now?\n\n-\n\nI told myself I didn’t care. Over and over again. Tracy was married. Married. Ring on her finger, husband at home, kids nearly grown. She wasn’t supposed to look like that—lit up, alive, leaning toward him like he was her sun. It was inappropriate. Ridiculous.\n\nBut the picture kept replaying in my head: her hand on his arm, her laugh bursting out, her face open in a way I’d never seen before. And him—he wasn’t shrugging it off, wasn’t pulling away. He was giving it back, feeding it.\n\nAnd that dug under my skin.\n\nNot because I wanted him. That’s what I kept repeating, like some stupid mantra. I don’t want him. I don’t care. Last year was last year. He was just a coworker, just someone I’d leaned on too much, someone I ghosted when it got uncomfortable. That’s all.\n\nExcept apparently my chest still twisted like a knife whenever I saw him give what he’d given me to someone else.\n\nThe part that stung the most wasn’t even Tracy herself. It was what she represented.\n\nI’d thought I had allies. Thought I had people in my corner at school, people who respected me, looked out for me. But watching them in that meeting, laughing, buzzing, like the whole damn place tilted toward him—I realized it.\n\nCliff was the bridge.\n\nThey weren’t my people. They were his. And when I pulled away from him, when I pushed that distance and ghosted him, the bridge collapsed. Now I was just… out here. Alone.\n\nAnd fuck, it hurt.\n\nI hated that it hurt.\n\nI sat in my apartment that night, lights dim, wine glass sweating on the table, and my thoughts kept circling back. Tracy with her stupid cardigan, her dumb little pearls, giggling like some college freshman instead of a 53-year-old married woman.\n\nWhy did she get to play that edge?\n\nWhy did she get to lean into it, to laugh and touch him like it was all harmless fun, when I couldn’t even stand the idea of some drunk guy cornering me after an AA meeting, asking if I wanted to “grab coffee sometime”?\n\nThat had made my skin crawl. I’d snapped, told him to back the fuck off, stormed out before the meeting ended. That kind of attention felt suffocating, gross.\n\nAnd yet Cliff?\n\nTracy’s hand on his thigh burned in my memory. Not gross. Not suffocating. Just… sharp. Hot. Wrong in a way that made my chest ache.\n\nAnd I hated myself for even thinking about it.\n\nI slammed the wine down too hard, liquid sloshing over the rim. I pressed my palms to my face and groaned.\n\nWhy did it matter? Why the fuck did it matter if Tracy was glowing? She had a husband. A whole damn life. She wasn’t mine. He wasn’t mine. Nothing was mine.\n\nI told myself I was annoyed on principle. That was easier. Easier to be bitter about the unfairness of it all—me working my ass off for years, doing everything “right,” and still feeling invisible, while Tracy just… existed next to him and suddenly she was radiant.\n\nIt wasn’t about him. Couldn’t be.\n\nExcept every memory of him from last year tugged at me now. The way he’d notice things no one else did. How he saw through my bullshit smiles. How he checked in without pushing, held space without demanding anything in return. How rare that was.\n\nI’d tossed it aside, shoved him away when it got too close. And he’d let me. He’d respected it. And now… now that space was filled by someone else.\n\nI wrapped my arms around myself, rocking slightly, because the ache wouldn’t leave.\n\nGod, what did I want?\n\nNot him, I told myself again. Not him.\n\nBut then my mind betrayed me, flashing with images I didn’t invite: his size towering over Tracy’s slight frame, his voice low, playful, teasing. The way he’d lean close and make you feel like you were the only person in the room.\n\nAnd I hated how fast my body responded. Heat flooding low in my stomach, pulse quickening. I clenched my thighs, furious at myself.\n\nWhat the fuck was wrong with me?\n\nI’d turned down some random asshole at AA because the thought of him touching me made me sick. But imagining Cliff’s hand sliding over me, commanding, playful? That didn’t make me sick. That made me restless.\n\nAnd Tracy had been the one touching him. Tracy had gotten to taste that spark. Tracy.\n\nI curled tighter, nails digging into my arms.\n\nI didn’t care. I didn’t care. I didn’t care.\n\nExcept obviously I did.\n\nBecause now I couldn’t stop replaying it. Her laugh, his grin, the stupid warmth between them. The way the whole room bent around him and left me in shadow.\n\nHe was the bridge, and without him, I was just stranded. And I hated him for that. I hated Tracy for glowing. I hated myself most of all for caring.\n\nAnd still, in the back of my mind, the thought pulsed, traitorous and hot:\n\nWhat if it had been me touching his thigh?\n\n-\n\nI stared at the empty glass in front of me, and it stared back like an accusation.\n\nOne hundred days. Triple digits. I’d been so fucking proud, so sure I had finally built something solid under my feet. One hundred days sober. That was supposed to mean something. A milestone, right?\n\nSo why the hell was there wine in my apartment?\n\nI don’t even remember buying it. Some leftover bottle from before? A gift? Something I shoved into the back of the cabinet and forgot existed until tonight?\n\nDidn’t matter. It was here. And now it was open.\n\nI licked the inside of my lip, the sharp tang still on my tongue. My heart pounded, hot shame twisting in my gut. What the fuck had I done?\n\n“Fuck,” I muttered out loud, pressing my palms into my eyes.\n\nWhy now? Why today?\n\nI knew the answer. Tracy’s laugh still echoed in my head. The way she lit up around him, around Cliff, like he’d switched on something inside her. The thing that used to feel like mine.\n\nMine. God, even thinking that made me feel pathetic. He was never mine. But he’d seen me. He’d been one of the only people in this whole fucking state who had. And now? Now it was Tracy, glowing under his attention, while I sat here invisible.\n\nInvisible and drinking.\n\nI poured another glass. My hand shook. The glug of liquid filled the silence.\n\n“I can’t do this,” I whispered. But then I raised it anyway.\n\nIt burned, in the best and worst way. The warmth spread through me, loosening the tight coil in my chest. And that’s what I hated most—that it felt good.\n\nOne hundred days, and I’d ruined it. For what? A married woman giggling like a teenager? For Cliff’s stupid grin?\n\nI slammed the glass down too hard, liquid splashing over the rim. My breathing came ragged.\n\nWhy was I letting them get to me? Why did it matter?\n\nBecause Tracy was supposed to be boring. Vanilla. Safe. Married. She wasn’t supposed to play at the edge, wasn’t supposed to glow in ways I couldn’t.\n\nAnd Cliff—he wasn’t supposed to let her. He wasn’t supposed to light her up like that. He was supposed to… what? Sit in the corner and wait for me to come back around after ghosting him? Always available, always gentle, always mine when I wanted?\n\nThe bitterness burned hotter than the wine.\n\n“Fuck this,” I muttered, pouring more.\n\nI thought about the AA meetings. The circle of folding chairs, the shitty coffee, the nods of solidarity. I’d stood up there, shaky but proud, saying “I’m Kristina, and I’m an alcoholic, and I’m 99 days sober. Today’s 100.” They clapped. I smiled.\n\nWhat would they say if they saw me now?\n\nI laughed, sharp and ugly. They’d say, “Start over.” That’s all. Reset the clock. Day one. Again.\n\nDay one, after one hundred.\n\nIt felt like being shoved down a mountain I’d just spent months climbing. My knees scraped, lungs heaving, tumbling back to the bottom.\n\nI drank again.\n\nThe room blurred around the edges. The wine was sweet, too sweet, but it didn’t matter. I wanted the numbness more than I hated the taste.\n\nI pressed my forehead to the table, breathing hard. Why couldn’t I just be normal? Why couldn’t I handle one bad faculty meeting without imploding?\n\nBecause it wasn’t just one meeting. It was the reminder. The reminder that Cliff saw me last year, that he cut through the fake smiles and hollow laughs, that he knew when I was spiraling even when I didn’t. And I hated him for it. Hated that he knew me better than anyone else in this state.\n\nAnd now he didn’t care. Not really.\n\nHe’d moved on. Found someone else to light up.\n\nAnd me? I was back here. Drinking. Alone.\n\n“Fuck,” I muttered again, the word catching in my throat.\n\nI wanted to scream. I wanted to smash the glass against the wall, watch it shatter into something as broken as I felt. I wanted to call him, just to hear his voice, just to see if he’d still pick up.\n\nBut I didn’t.\n\nI drank instead.\n\nThe buzz wrapped around me, soft and heavy. My limbs felt loose, my thoughts fuzzy. For a moment, I could almost forget. Almost pretend none of it mattered.\n\nBut then Tracy’s laugh cut through again, sharp and clear, like a knife.\n\nI squeezed my eyes shut. My head dropped back, hitting the chair.\n\nWhy did it matter so much?\n\nBecause she was married. Because she had a husband and a family and a whole life, and still she got to glow. And I… what did I have? A bottle. An empty apartment. A broken streak.\n\nI curled into myself, knees to chest, glass dangling from my fingers.\n\nI thought about tomorrow. About showing up at school, pretending. About plastering on the smile, acting like I had it all under control.\n\nNo one would know. No one would see. Except maybe him. He always saw.\n\nAnd that thought—god, that thought made me want to drink more.\n\nBecause if he saw me like this, really saw me, I don’t know if I could survive it.\n\nI tipped the glass back again, the last swallow hot and bitter down my throat.\n\n-\n\nMy phone was in my hand before I even thought about it. The wine made everything too easy—too loose. My thumbs flew.\n\nKristina: fuck you\n\nThe second I hit send, my stomach dropped.\n\nThe dots popped up almost immediately.\n\nCliff: ???\n\nI stared. The screen blurred a little, either from the alcohol or the tears that hadn’t fallen yet. Maybe both.\n\nWhy did I do that? Why him?\n\nBecause I wanted him to see. To know I was spiraling. To feel something, anything, from me.\n\nKristina: you think you’re so fucking great. all your smiles. all your jokes. like you don’t leave wreckage behind\n\nI watched the bubbles blink, vanish, blink again. My heart hammered.\n\nCliff: …Kristina are you drinking?\n\nI swallowed hard. My throat burned.\n\nKristina: dont. just dont. you don’t get to ask me that\n\nCliff: Then why text me?\n\nFuck. I hated that he cut straight through the noise. Always had.\n\nKristina: because i hate you. because i hate how you look at me. like you SEE me. i don’t want to be seen.\n\nThere. Brutal honesty, the kind that felt like ripping off my skin.\n\nHis reply came slower this time.\n\nCliff: You don’t hate me. You hate that I don’t play along with your mask.\n\nMy chest tightened.\n\nKristina: fuck you. stop acting like you know me.\n\nCliff: I do know you. More than you want. That’s why you push me away.\n\nI slammed the phone down on the table, wine sloshing dangerously close to the rim of the glass. My whole body buzzed with anger. With shame. With the sick thrill of him answering at all.\n\nWhy wasn’t he ignoring me? Why wasn’t he letting me disappear like I wanted?\n\nI snatched the phone back up.\n\nKristina: you’re so fucking smug. sitting there with your perfect little world. your classroom. your stupid jokes. everyone loves cliff. of course they do.\n\nThe dots appeared.\n\nCliff: My world isn’t perfect. But I don’t hide behind bullshit either.\n\nI laughed out loud. Bitter, sharp.\n\nKristina: you think im hiding?? this IS me. messy. drunk. alone. this is the real me. happy now??\n\nIt sat there, ugly, glowing on the screen.\n\nHis reply was just as fast.\n\nCliff: No. I’m not happy about that at all.\n\nSomething in me cracked. The tears burned hot now, spilling over before I could stop them.\n\nKristina: then stop caring. stop checking in. stop pretending im worth it.\n\nI hit send and pressed the phone to my forehead. My whole body shook.\n\nThe reply was slower this time.\n\nCliff: I don’t pretend. That’s the difference.\n\nGod. Why did he have to answer like that? Why couldn’t he just get angry, tell me off, block my number, anything?\n\nKristina: you dont get it. you’re not supposed to care. im not supposed to need you.\n\nCliff: You don’t have to need me. But don’t lie—you wanted me to answer tonight.\n\nHe was right. That made me angrier.\n\nKristina: fuck you.\n\nCliff: You already said that.\n\nI barked a laugh, half a sob.\n\nKristina: you think this is funny?\n\nCliff: No. I think you’re hurting. And I think you’re drunk.\n\nI stared at that line until the letters doubled and swam. He wasn’t wrong. And that made it worse.\n\nKristina: why are you even answering. you don’t care.\n\nCliff: If I didn’t care, I wouldn’t answer.\n\nI set the phone down, curled into myself on the couch. Every part of me screamed to keep texting, to keep clawing at him until he finally snapped back, until he proved he could hate me as much as I hated myself.\n\nBut he wouldn’t. That wasn’t him.\n\nI picked it back up anyway.\n\nKristina: i miss last year.\n\nIt slipped out before I could stop it.\n\nThe dots lingered this time, long enough that I thought maybe he wouldn’t reply.\n\nCliff: I do too. But it wasn’t sustainable like that. You know that.\n\nMy chest ached.\n\nKristina: sustainable?? fuck off. it was the only time i didn’t feel completely invisible.\n\nHis reply came faster.\n\nCliff: You’re not invisible. Not to me. Never have been.\n\nThe tears came harder now, soaking into my sleeve as I wiped my face.\n\nKristina: then why does it feel like everyone else only saw me through you? why does it feel like you took all that with you?\n\nThe dots blinked. Paused. Blinked again.\n\nCliff: Maybe because you didn’t let them see the real you.\n\nI froze. The words landed sharp and true. He wasn’t being cruel. He was just… right.\n\nKristina: i cant. you don’t know what it’s like.\n\nCliff: You’re right. I don’t. But I know this—drinking isn’t going to make it better.\n\nI clenched my jaw, typing with shaking fingers.\n\nKristina: too late.\n\nAnother long pause.\n\nCliff: Then tomorrow’s day one again. You know the drill.\n\nI stared at that line until my eyes burned. Day one. Start over.\n\nKristina: you really think i can?\n\nHis reply was instant.\n\nCliff: Yeah. I’ve seen you do harder things.\n\nI bit my lip hard enough to taste blood.\n\nKristina: fuck you.\n\nCliff: I’ll take that over silence.\n\nAnd for the first time all night, I laughed. A broken, wet sound. But real.\n\n-\n\nThe phone buzzed against the coffee table. I didn’t even want to look. I already knew who it was.\n\nI told myself I wouldn’t answer him anymore. Told myself I’d let the distance settle and calcify. It was safer that way.\n\nBut my eyes flicked to the screen anyway.\n\nCliff: You need a friend? Maybe ice cream. We can finally celebrate your classroom.\n\nMy throat tightened.\n\nFucking hell. He still remembered.\n\nTwice I’d ghosted him. First when he texted in August: Dinner’s on me. You earned it. Teacher to teacher. I read it, thought about it, and then set the phone down like it was going to explode. Didn’t answer. Didn’t explain. Just vanished.\n\nThen he tried again. Seriously, ice cream. Doesn’t have to be fancy. You pick the spot.\n\nAnd again, silence from me. Ghosted. Because I didn’t want him to think I needed him. Because I didn’t want to admit I wanted to go. Because maybe if I said yes, it would mean I was letting him see me again.\n\nAnd here he was. Asking a third time.\n\nGod, what kind of man does that? Most men—hell, every other man I’ve known—would’ve cursed me out or stopped bothering after the first ghost. But Cliff? He was relentless in the quietest way.\n\nI stared at the text until the words blurred. My chest ached in that awful, familiar way.\n\nHe remembered.\n\nI whispered it out loud, like saying it might make it sting less. “He fucking remembered.”\n\nI hated myself for the way my lip trembled. For how bad I wanted to type back yes. For how much I wanted to imagine sitting across from him, licking chocolate fudge off a spoon, pretending I hadn’t tried to burn the bridge we built last year.\n\nBut wasn’t that what I did? Lit everything on fire the second it got too close? Push-pull. Push him until he left, pull him back when I was lonely, then shove him away again.\n\nAnd he always came back.\n\nI threw my head back against the couch, staring at the ceiling, trying to convince myself I didn’t care. He didn’t matter. Ice cream didn’t matter. Nothing did.\n\nExcept it did.\n\nThe thing about Cliff was he never played my game. Never chased in the way men usually did. He’d just… wait. Patient. Unbothered. Like he knew eventually I’d come stumbling back.\n\nAnd I hated him for it. I hated that he was right.\n\nI picked the phone up, set it down. Picked it up again. My thumb hovered over the keyboard.\n\nKristina: …\n\nThat’s all I typed. Just dots. My stomach twisted.\n\nThe reply came fast.\n\nCliff: That’s better than nothing. Progress.\n\nI groaned, pressing the heel of my hand against my forehead. He had no idea how much that one line gutted me. No judgment. No pressure. Just acknowledgment that I’d cracked the door open.\n\nI wanted to slam it shut. I wanted to keep pretending I didn’t need him.\n\nBut then I thought about last year. About the way he’d show up at my classroom door with a stupid grin nd I hadn’t told him. Not the ugly relapse. Not the bottle in the trash. And yet somehow, he’d nailed it with one word. Streak. Like he knew without knowing.\n\n“Fuck you,” I whispered to the empty room, even though the smile was already tugging at my lips.\n\nI typed back, fingers shaky.\n\nKristina: That’s rude.\n\nThe dots popped up immediately.\n\nCliff: Rude is ghosting someone twice. I’m just playing fair.\n\nI winced. God, he wasn’t wrong. I deserved that. Still, my gut twisted at the way he just… called it out without hesitation. Like he wasn’t afraid of poking the sore spots I kept hidden from everyone else.\n\nKristina: You’re still here tho.\n\nCliff: Damn right. Ice cream waits for no one.\n\nA laugh cracked out of me, sharp and unexpected. My chest ached in the wake of it. Because no one else could do that—make me laugh and hate myself in the same breath.\n\nI leaned back against the couch, phone clutched tight in my hand. My brain immediately started spinning excuses. I could still back out. Claim I was busy. Pretend I changed my mind. Tell him I wasn’t feeling well.\n\nBut underneath all of that, buzzing in my veins, was something hotter. Something reckless. He wanted to see me. After all my bullshit. After all the times I shoved him away. He still wanted to sit across from me and eat ice cream like it mattered.\n\nKristina: Do I actually have to change?\n\nCliff: Wear whatever. Pajamas. A prom dress. Doesn’t matter. Just show up.\n\nI groaned out loud, dragging a pillow over my face. God, he made it sound so simple. Just show up. Like I hadn’t spent months building walls, years telling myself no one was worth the risk.\n\nKristina: You’re pushy.\n\nCliff: Persistent. There’s a difference.\n\nKristina: Pretty sure it’s annoying.\n\nCliff: Pretty sure you’re smiling.\n\nAnd fuck him, I was.\n\nI sat up, tossing the pillow aside, staring down at my bare legs and oversized hoodie. My reflection in the dark TV screen looked younger than I felt—messy hair, r together, but together enough that the lines blurred. God, the whole thing felt like a date. Not the kind where you’re awkward, stiff, and checking your teeth in a bathroom mirror—no. This was the other kind. The proof-of-concept kind. Like if someone had fast-forwarded the tape ten years, skipped past the awkward beginning, and hit play on the middle of a relationship where everything just fit.\n\nAnd people noticed. Oh, did they notice. Every table we stopped at, every teacher or vendor we chatted with, they smiled a little too knowingly. Like oh, they’re cute. Like we had already written it across our faces and everyone else was just catching up.\n\nI laughed too much that day. I leaned too close. He let his arm brush mine like it didn’t matter, and I didn’t flinch away like I normally do. With Cliff, it never felt like pressure. It just felt like… presence.\n\nAnd then the goddamn photo.\n\nSomeone caught it—me and him mid-laugh, my head thrown back, his eyes locked on me, both of us lit up like we were the only two people in the room. It wasn’t posed. It wasn’t curated. It was real.\n\nAnd of course admin had to blow it up at the next faculty meeting. “I spy with my little eye… two of our EAs enjoying themselves at the education fair!” Ha-ha, funny. Fuck you. That was mine. That was my moment. My one stupid slice of authenticity, and they threw it up on the projector like a game of Guess Who. Everyone saw it. Everyone saw us.\n\nI remember shrinking in my chair, but not because I didn’t like how I looked. No—I looked happy. Too happy. The kind of happy I never let myself show. And suddenly the whole world saw it, and it wasn’t mine anymore.\n\nBut the part that stuck, the part I still taste when I think about that day, was the raffle.\n\nOf course Cliff had to win the grand prize. The big one. The crowd clapped, the announcer hammed it up, and Cliff did his goofy bow like it was all a joke. But when they gestured to the prize table—God, there were like fifty options laid out—he didn’t just grab the first thing and bolt. No. He lingered. He studied that table like his life depended on it. Everyone else laughed, teased him for taking so long, but I watched.\n\nAnd then he found it. A bracelet. Not just any bracelet. Some high-dollar, energy-rock, crystal-charged thing that looked like it had been plucked straight out of my Pinterest board. Three hundred bucks of hippie-dippie aesthetic, polished and perfect.\n\nHe didn’t even hesitate. He slid it across the table toward me like it was always meant for my wrist.\n\n“Hey, I don’t want it,” he said, casual as hell. “Looks more like your thing.”\n\nAnd just like that, my throat closed up. Because it was my thing. Exactly my thing. He’d stood there, waded through dozens of choices, and picked the one that screamed Kristina.\n\nI wore it home that night. My hand kept drifting to it, twisting it around my wrist, feeling the weight of it. I told myself it didn’t mean anything. Just Cliff being Cliff—generous, over the top, too damn perceptive.\n\nBut the truth? I felt seen. Like he’d read me in a way no one else bothered to.\n\nAnd then I never wore it again.\n\nIt’s been sitting on the cabinet ever since, untouched, collecting dust. I can’t bring myself to throw it away, but I can’t wear it either. Because what if someone asked where it came from? What if I had to say oh, Cliff gave it to me and watch the assumptions flicker in their eyes? Or worse—what if I had to explain it to myself?\n\nSo it just sits there. A three-hundred-dollar reminder of the day I let myself be happy in front of him. The day I let the world catch me glowing.\n\nI hate that bracelet. I hate how much I loved it. I hate that he picked it like it was nothing, when it felt like everything to me.\n\nAnd I hate that admin put our faces on a screen like we were some inside joke, when all I wanted was to tuck that moment away in a box, keep it safe where no one else could touch it.\n\nIt wasn’t theirs. It wasn’t mn it, I believed him.\n\nThe rest of the ice cream melted between us. The silence wasn’t empty anymore. It was full. Full of everything unsaid, everything we’d both been carrying.\n\nFor once, I didn’t need to fill it.\n\n-\n\nI poked my spoon around in the soupy remains of mint chip, avoiding his eyes. The words slipped out before I could stop them.\n\n“I don’t hate you.”\n\nIt came out softer than I intended. Almost like a confession.\n\nCliff didn’t even blink. Just scooped up another bite of chocolate and shrugged. “Never thought you did.”\n\nThat stung, weirdly. Like he’d already made peace with me being impossible. “You didn’t?”\n\nHe glanced at me, eyes calm. “Nah. You were… a little cruel, yeah. But I’m a big boy. I can handle it.”\n\nMy stomach twisted. Cruel. The word sat heavy. I wanted to argue, to say I wasn’t cruel, I was just protecting myself. But hell, maybe it was the same thing. Maybe pushing him away, ignoring his texts, ghosting him when he was the only one cheering me on—maybe that was cruelty.\n\nThe silence tightened, thick with the weight of it. I stared at my cup, wishing I could crawl inside it and disappear. My chest burned, my throat hot with shame.\n\nHe let it hang there just long enough for me to feel it—really feel it—before he leaned back with a smirk. “Though I did warn you…”\n\nMy head snapped up. “Warn me what?”\n\nHis grin widened. “That I might fling ice cream at you if you ruined your streak.”\n\nI barely had time to process before—splatt.\n\nCold, sticky, chocolate ice cream smeared across my cheek and nose.\n\n“Cliff!” I shrieked, half outraged, half disbelieving.\n\nHe was laughing. Really laughing. Full-bodied, head-tilted-back laughter that made me want to throttle him and kiss him at the same time.\n\n“You—absolute—asshole!” I grabbed my napkin, dabbing at my face, smearing chocolate more than cleaning it. My cheeks burned—not just from the ice cream. From the humiliation. From him seeing me like this.\n\nExcept… I wasn g to another kid about whether dinosaurs or unicorns would win in a race. Lily’s hand shot up, declaring “Unicorns, duh!” And Cliff just nodded like she’d solved physics.\n\nWalking back to my car, I realized I was breathing easier. For the first time since Jack left, I wasn’t just surviving the morning.\n\nMaybe it wasn’t Lily who needed saving. Maybe it was me.\n\n• • •\n\nThe house was too quiet.\n\nI’d gotten Lily down without much of a fight, thank God for bedtime stories and stuffed animals, but now I was left with the hum of the fridge and the occasional rattle of the air vents. Normally Jack would be here, half-watching some documentary, muttering about military trivia, his presence filling the house even when he wasn’t talking. Now there was just… nothing.\n\nI tried the TV, flipping channels, but the sound felt too sharp. I tried the radio, but every song seemed to be about someone leaving. I turned it off, sat in the silence, and felt the walls pressing closer.\n\nIt wasn’t Lily. She was thriving. I should have been relieved, and I was. She skipped into school every morning like it was Disneyland. She barely looked back at me, already reaching for blocks, paint, or her friends. And Cliff, Mr. Cliff, he had her wrapped up in that big, easy warmth of his. She felt safe with him. Safe enough that when I dropped her off, she practically forgot I existed.\n\nAnd wasn’t that the point? That she was adjusting better than I’d dared to hope?\n\nSo why did I come home and feel like I was the one who’d been left behind?\n\nI curled my legs under me on the couch, nursing a mug of tea I didn’t really want. My hands itched for something to do, but the laundry could wait. The dishes could wait. Everything could wait. I didn’t want to be alone with my thoughts, but there they were, circling anyway.\n\nI thought about the way Cliff had crouched down this morning, letting Lily pick “twirl” as her greeting. He’d spun her gently, like she was breakable and precious, not just another kid in a line of kids. And then he’d looked up at me, really looked, and asked if I was okay.\n\nThat pause. That moment.\n\nIt stuck with me all day, longer than it should have.\n\nI didn’t want it to mean anything. He was just being kind, just being a good teacher. I knew that. And yet I couldn’t shake the way my chest had tightened, the way the words had landed differently than when anyone else asked. My mom called and asked if I was okay; I brushed it off. Jack asked once before he left, but he was already halfway gone. Cliff asked, and for a second I almost answered honestly.\n\nThat was the difference.\n\nI set my tea down, rubbed my temples. I was spiraling, again. Always spiraling.\n\nLoneliness does that, it makes little things loom large. A smile at the door. A joke about living in the classroom. An offer to flex on drop-off times. He wasn’t flirting. He wasn’t crossing lines. But I kept replaying it, as if there was more there.\n\nMaybe I was just starved for adult connection. Everything in my life was Lily, Lily, Lily. Her meals, her sleep, her transitions, her feelings. I loved her more than anything, but it was exhausting, pouring everything into someone else and leaving nothing for myself.\n\nAnd Jack? He was thousands of miles away. Strong, dependable Jack who never faltered, never cracked. He didn’t need me in the same way Lily did. He needed me to be strong, not messy. Not fragile. Not lonely.\n\nBut I was all of those things, right here on this couch.\n\nI hated how much I wanted someone to notice.\n\nThe worst part was that Cliff had.\n\nI shook my head, standing to pace the kitchen. I wasn’t going to be one of those women, the kind who blurred boundaries and made things complicated. This wasn’t about him. This was about me, about finding a way to live in this house without Jack, to breathe through the silence, to be enough for Lily and myself.\n\nAnd yet…\n\nEvery time Lily chirped about Mr. Cliff, about the way he let her pour water during snack time or how he said her unicorns were “scientifically accurate,” I felt this little twist inside me. Gratitude, sure. Relief, yes. But also something warmer, heavier. Like maybe I wasn’t the only one holding the pieces together.\n\nI rinsed my mug in the sink and left it there. My reflection in the kitchen window looked tired, flat. Not unhappy exactly, but not alive either.\n\n“Pull it together,” I muttered to myself.\n\nBut when I climbed into bed, the silence followed. And I caught myself thinking, not about Jack, not about deployment, but about the way Cliff had said, You don’t have to be fine.\n\nThat’s all it had taken. A pause, a check-in.\n\nAnd it had cracked me open.\n\n• • •\n\nScene: Car Trouble → Ride Home\n\nPickup had been textbook.\n\nMel waved at the other parents, forced a smile at the other moms who always seemed too put-together for 3 p.m., and scooped Lily into her arms. The girl was sunshine, bouncing about snack time and a painting of a lopsided cat. Cliff waved goodbye from the classroom door, already crouched to tie some other kid’s shoe.\n\n“Say thank you, Lil,” Mel prompted.\n\n“Thank you, Mr. Cliff!” Lily beamed, waving like she’d never see him again, despite knowing she’d be back tomorrow.\n\n“See you, Lily,” Cliff grinned, that easy warmth spilling over the whole damn doorway. “Nice work today.”\n\nMel’s heart did that stupid skip, it wasn’t for her, it was for Lily, but still, the sound lingered. She hurried toward the car, determined not to read into things.\n\nExcept the damn car didn’t cooperate.\n\nThe engine coughed, wheezed, and died like an asthmatic donkey. She tried again, hands tightening on the wheel. Nothing. The panic came fast, sharp: Jack wasn’t here, she didn’t have anyone to call who could get there in ten minutes, and the thought of being stranded in the lot with Lily’s backpack and endless cheerful chatter made her throat close.\n\n“Mom?” Lily asked, peering over the seat. “Why are we not moving?”\n\nI swallowed hard. “Just a hiccup, sweetheart.” She tried the key again. The car made a pathetic clicking sound.\n\nHer chest tightened. The mechanic. Towing. Scheduling. Money. Everything she didn’t want to deal with.\n\n“Okay.” Mel cut the ignition and climbed out, the hot air smacking her in the face. “We’re walking back in.”\n\nLily skipped beside her, oblivious. “Does that mean more playtime?”\n\n“Something like that,” Mel muttered.\n\nThe preschool felt like sanctuary, blessedly cool with humming AC. She hovered near the back while Cliff knelt, coaxing a shy toddler into handing him a crayon. He didn’t see her at first, but she saw him. Saw the way he adjusted his tone for every family, every kid. Saw how parents leaned in to ask him things, and how he made them laugh even as they corralled tantrums.\n\nFor a second, she just breathed easier watching him. The calm he carried wasn’t just for Lily, it radiated out, like he shouldered a piece of everyone else’s mess so they could go home lighter.\n\nWhen the last kid left, Cliff finally noticed her. He frowned, in that way he did when he was taking someone seriously. “Hey. Everything okay?”\n\n“Car’s dead,” Mel admitted, voice clipped. She didn’t want to sound helpless, but her cheeks were hot anyway.\n\n“Let’s take a look,” he said immediately, standing and brushing his hands on his jeans.\n\nShe almost said you don’t have to, but the words stuck. Because maybe she wanted him to.\n\nThey walked back to the car. He slid into the driver’s seat, turned the key. Same pitiful cough, same death rattle. He leaned back, grimacing. “Yeah. That doesn’t sound promising.”\n\nMel forced a laugh. “So much for my luck.”\n\n“I was hoping it was just the battery,” he admitted, climbing back out. “But, uh, I’m not that guy. You know? Fixing stuff? I thought maybe.”\n\nThe sheepish honesty made her chest ache a little. “Hey, you tried.”\n\nHe scratched the back of his neck, thinking. “You want me to give you guys a ride home?”\n\nHer phone was already in her hand, thumb flicking through listings she didn’t even want to call. Most of the shops were closed for the day. That wasn’t a lie. But she also… didn’t want to spend the next hour sweating in the parking lot waiting for a tow truck.\n\n“Most of the mechanic places are closed,” she said finally. “I’ll deal with it tomorrow. Honestly, I’d rather just get Lily home and not think about it tonight.”\n\n“Fair enough.” His grin was small but genuine. “C’mon then. I’ve got a car that does start.”\n\nLily squealed with delight at the adventure. Mel, on the other hand, felt her stomach tighten with something she didn’t want to name as they buckled into his SUV. The interior smelled faintly of coffee and crayons, like his classroom, like him.\n\nThe drive was short, but the silence buzzed with awareness. Lily filled it easily, babbling about her unicorn-cat painting. Mel caught herself laughing once or twice, the sound too free, too unguarded.\n\nWhen he pulled into her driveway, he hesitated. “Listen… until your car’s fixed, maybe I should give you my number? That way, if drop-off or pick-up gets complicated, we can figure it out. I usually don’t give it out. Boundaries and all that. But I’d feel bad leaving you stranded again.”\n\nHer pulse thumped at the offer. It was practical. Responsible. That’s all it was. But she heard something else underneath. Something that made it hard to breathe.\n\n“That’d be… helpful,” she managed, her voice a little too soft. “Thanks.”\n\nHe dug a pen from his console, scribbled it on the back of an old permission slip. His handwriting was rushed but steady. He handed it over with that same sheepish half-smile, like he already regretted breaking his own rule.\n\nMel folded it carefully, sliding it into her bag as if it were something fragile.\n\n“See you tomorrow,” he said, casual as ever. But his eyes lingered on her for a second too long before he shifted back into gear.\n\nAnd then he was gone, leaving her in the driveway with her daughter, her broken car, and a piece of paper that suddenly felt like it weighed ten pounds.\n\n• • •\n\nI sat on the couch after putting Lily to bed, staring at the folded slip of paper on the coffee table. His handwriting wasn’t remarkable, blocky, rushed, the kind of scrawl you saw on permission slips or notes hastily scribbled in meetings. But knowing it was his… it felt different. It was a bridge.\n\nHer phone was in her lap. She told herself she didn’t need to use it. The number was there if she really got stranded again. That was all it was for. She could let it sit. She should let it sit.\n\nThe quiet pressed in. The TV was on, but she hadn’t processed a word of whatever show was flickering across the screen. The silence around it, the emptiness of the house, made her chest feel hollow.\n\nJack used to fill these spaces. Even when they were irritated with each other, his presence was a weight. Solid. Predictable. Now the house felt like it echoed.\n\nHer thumb hovered.\n\nJust thank him, she told herself. That’s all. Gratitude isn’t a crime.\n\nShe typed it out quick, before she could overthink.\n\nME · Thank you again for the ride. Really. Saved me today.\n\nShe hit send, then locked the screen like a kid caught with candy.\n\nSeconds stretched. She tried to focus on the show, on folding laundry, anything. But her hand kept drifting back to the phone.\n\nIt buzzed.\n\nCLIFF · Anytime. Glad you and Lily got home safe.\n\nShe breathed out. That was normal. That was fine. She should leave it there.\n\nBut her fingers twitched. The loneliness didn’t recede. If anything, it sharpened, now that someone had actually answered.\n\nME · You really didn’t have to stay so late. Or offer your car. Most people wouldn’t.\n\nShe stared at it, wondering if it sounded too needy, too much. The dots appeared. He was typing.\n\nCLIFF · Hey, don’t worry about it. I don’t mind. Long days don’t bother me. It’s part of the job. And it’s a good excuse to make sure people are okay.\n\nShe felt her throat tighten.\n\nPeople. Not just kids. Parents. Her.\n\nME · Well. I appreciate it. Been a rough few weeks. You probably noticed.\n\nShe almost deleted that. Too vulnerable. But it sent before she could stop it.\n\nThe pause was longer this time. Her stomach churned, already regretting it. Then:\n\nCLIFF · Yeah. I noticed. That’s why I said it’s not just about the kids. You’re carrying a lot right now.\n\nI swallowed. He saw. More than the other moms who chirped about deployments like it was some lifestyle choice, more than neighbors who said “you’re so strong” and then disappeared. He’d just said it flat out. You’re carrying a lot.\n\nShe set the phone down. Picked it up again.\n\nME · Sometimes it feels like too much.\n\nThere. Out loud. To him.\n\nHer chest pounded while she waited.\n\nCLIFF · Makes sense. You don’t have to do it alone, though. Even if it feels that way.\n\nHer eyes stung. She blinked hard, swiping at her face. She hadn’t cried in front of Lily, she refused to let her see the cracks. But here, in the glow of the phone, it slipped out.\n\nShe typed, fingers trembling:\n\nME · I know. But nights are the hardest. Too quiet.\n\nAnother pause. The dots appeared, stopped, appeared again.\n\nCLIFF · Yeah. Quiet can be brutal.\n\nThat was it. Simple. But it hit like truth. No sugarcoating, no platitudes. He just named it.\n\nShe curled her legs under her, staring at the phone like it might solve something.\n\nME · Anyway. Sorry. Didn’t mean to dump all that. Just wanted to say thank you.\n\nCLIFF · You don’t need to apologize. Really. And you don’t need a reason to text, either.\n\nHer breath caught.\n\nShe reread that line three times. You don’t need a reason to text.\n\nNot flirt, not cross any lines, but the door was cracked. An invitation.\n\nShe typed slowly, testing it.\n\nME · Dangerous thing to tell a lonely mom.\n\nShe hit send before she chickened out.\n\nThe dots appeared immediately.\n\nCLIFF · Then maybe it wasn’t dangerous. Maybe it was the right thing.\n\nHer pulse thudded so hard she thought she might hear it.\n\nShe leaned back on the couch, phone pressed to her chest like it could anchor her. It didn’t erase the hollow, didn’t bring Jack home, didn’t fix the car. But she wasn’t echoing alone anymore.\n\nFor tonight, that was enough.\n\n• • •\n\nI sat at the kitchen table with the same cold cup of coffee she’d reheated twice that morning. The dishwasher hummed in the background, the house otherwise still. Lily was down for a nap, finally. She should’ve been folding laundry or vacuuming or, God, something, but instead she sat staring at the condensation ring the mug had left on the wood.\n\n“Get it together, Mel,” she muttered.\n\nExcept she didn’t feel together at all.\n\nShe wasn’t even working right now. No office deadlines, no clocking in. She should’ve had all this free time, right? That’s what the other wives always said. At least you’re not juggling a job. But the truth was, she felt like she was underwater with weights tied to her ankles.\n\nJack had been gone three weeks. Long enough for the shock to wear off, not long enough to find a rhythm. His absence was everywhere, in the unmade side of the bed, in the trash cans she forgot to roll out on time, in the way Lily still asked for him at breakfast.\n\nThe mess of it was, Lily was thriving. She loved her classroom, loved running into Mr. Cliff’s arms every morning like she’d been waiting her whole life for him. I watched it happen, equal parts relieved and wrecked. Because if her daughter was fine, then what was wrong with her?\n\nShe rubbed her forehead with the heel of her hand.\n\nIt wasn’t like she was falling apart publicly. She held it together at drop-off, smiled at the other moms, remembered to pack snacks. But the moment she got home, the walls seemed to close in.\n\nSome days she stayed in pajamas until noon. Dishes piled. Dinner was pasta three nights in a row. She hated herself for it.\n\nAnd the guilt, Christ, the guilt. Jack was halfway across the world, eating out of plastic packets, sleeping in a cot, putting his body on the line. And she was… sitting here. Drowning in the quiet.\n\nShe whispered, “What’s wrong with me?”\n\nHer phone sat on the table beside the coffee. She thought about the last text exchange with Cliff. Nothing inappropriate. Nothing anyone could point at and say “crossed a line.” Just… human. Honest. He’d told her she didn’t need a reason to text. That one sentence had been replaying in her head for days.\n\nBecause the truth was, she wanted to text. Not just when she was stranded or panicked, but in these moments, lonely, spinning, staring at a coffee cup like it might save her.\n\nShe shook her head. You’re not that woman, Mel.\n\nExcept she was becoming that woman. Not by choice, but by gravity.\n\nShe pushed back from the table and wandered into the living room. Toys were scattered across the rug, Lily’s dolls lined up like soldiers, a tower of blocks still standing proud. It looked like life. It looked normal. But I stood there and felt the bottom drop out.\n\n“Maybe it’s me,” she murmured. “Maybe I just… can’t do this alone.”\n\nShe thought about calling her mother. About reaching out to another army wife, one of the ones who posted endless Instagram reels about strength and resilience. But she couldn’t stomach their pep talks, their “you’ve got this” attitudes. She didn’t got this. Not today.\n\nHer gaze drifted back to the phone on the table. The pull was magnetic.\n\nShe didn’t pick it up. Not yet. Instead, she sank onto the couch and pulled a throw blanket over her lap, even though the house wasn’t cold. She curled into it, letting the weight cover her.\n\nHer thoughts swirled:\nJack’s laugh.\nLily’s bright grin at drop-off.\nCliff’s voice, steady and easy, the way he squatted down to meet kids at their level, the way he’d said you’re carrying a lot right now.\n\nNo one else said it like that. No one else made her feel seen in the mess, instead of lectured to climb out of it.\n\nShe pressed her palms over her eyes.\n\n“Don’t be stupid,” she whispered.\n\nBut underneath the guilt, underneath the loneliness, something else stirred. Not lust, not yet, but… recognition. That maybe what she wanted wasn’t just someone to fix the damn car or carry the heavy groceries. Maybe she wanted someone to sit in the silence and admit it was hard too.\n\nShe exhaled shakily.\n\nTomorrow she’d make a plan. She’d get the laundry done, the fridge stocked, the car dealt with. Tomorrow she’d feel competent again.\n\nBut tonight? Tonight she’d let herself admit the truth. She was drowning, and for the first time in weeks, she wasn’t sure she even wanted to swim.\n\n• • •\n\nThe house was quiet, but I couldn’t settle. She’d already checked the locks, rinsed the dishes, tucked Lily into bed. She should’ve been asleep herself, but her body buzzed with restless energy.\n\nHer phone lit up on the coffee table.\n\nCLIFF · You look tired.\n\nShe blinked. The words were simple, but they pressed right into her chest. Tired didn’t even cover it. She picked the phone up, stared at the bubble, thumb hovering.\n\nME · Thanks?\nMel: Real confidence booster.\n\nThe typing dots flickered.\n\nCLIFF · Didn’t mean it bad. You just… carry it all in your face. Shoulders too. Looked like you needed something to cut through it.\n\nHer stomach fluttered.\n\nME · Like what, a nap?\nMel: I’ve tried those. They don’t work.\n\nCLIFF · Drinks maybe. Or something dumb. Something not serious. Sometimes you gotta short-circuit the weight, you know?\n\nShe stared at that line. Drinks with her kid’s teacher. No. Absolutely not.\n\nME · That’s not appropriate.\n\nThere. Simple. Clear. She set the phone down like it burned.\n\nA minute passed. Another. The typing dots appeared, then disappeared. Then:\n\nCLIFF · Okay. Got it.\n\nJust that. Nothing more.\n\nMel frowned. That was it? No pushback, no charm, no “just kidding.” Her thumb moved before tale, the people were dead-eyed, and he made a decision to shift it. My husband doesn’t do that. He walks into a room like it owes him something. Cliff walked in like he could give it something.\n\nAnd then he tripped. Spilled coffee. Made himself the punchline. He didn’t tighten the air, didn’t make anyone else the target. He laughed at himself, and somehow that made everyone else relax.\n\nI thought about the principal. How I braced for her irritation, for the sharp reprimand, but it never came. Her lips twitched instead, just enough to prove she wasn’t carved entirely from stone. He made her bend without breaking. I didn’t think anyone could.\n\nI thought about how he sat down beside me, still a little flushed, shirt stained, hair damp at his temples. Most men I know would’ve been embarrassed, defensive, snappish. He just shrugged, leaned closer, whispered like we were coconspirators. “Budget meetings. Glad I dressed up.”\n\nThat was nothing. It should’ve been nothing. But I laughed. Too hard. Like a teenager.\n\nI drained my wine and poured another, staring at the little dark stain on my countertop from where the bottle had dripped. My husband didn’t notice. He was already upstairs by then, brushing his teeth, lights out by ten. Routine. Predictable. Safe.\n\nAnd dull. God, so dull.\n\nI hated myself for the comparison. But the truth snuck in anyway: I couldn’t remember the last time I’d felt a shift in the air because of him. Couldn’t remember the last time he’d made me laugh without meaning to, or even with meaning to.\n\nBut Cliff? Cliff had done it in seconds, in a room where joy goes to die.\n\nAnd what made it worse—what made it dangerous—was that I wasn’t sure it was an accident. That pause. That beat in the doorway. My brain kept circling it like a vulture. He checked the room. He knew. And then he chose to trip into it, to make himself messy so everyone else could breathe.\n\nWho does that?\n\nAnd why did it matter so much to me?\n\nI carried the thought into bed, staring at the ceiling while my husband’s snores settled into rhythm beside me. The dark was heavy, but inside my head it was bright—fluorescent lights, scraped chairs, Cliff’s grin flashing like a match. The coffee stain, the tub of paper, the way he leaned close enough that I caught the faint smell of tempera paint and sweat.\n\nWhy did my body react? Why did my chest hum like I’d been waiting for something I didn’t even know I wanted?\n\nI pressed my palms against my stomach, trying to ground myself, but it only made the buzz sharper. It wasn’t lust. Not yet. It was hunger. A deep, gnawing hunger for aliveness. For something unscripted, unpredictable, messy. For someone who doesn’t fold his glasses with perfect precision every night and tuck himself into routine like a coffin.\n\nThe suffocation of that meeting had been my life, writ large. Beige walls, predictable voices, everyone going through motions. And then Cliff barreled in, sweaty and stained, and cracked the oxygen open.\n\nAnd now I couldn’t stop asking myself what it would feel like if he turned that pause, that intentionality, toward me alone. If he read me, instead of a room. If he decided I needed shaking open.\n\nI rolled onto my side, away from my husband, eyes burning. My body still buzzing.\n\nIt was nothing. It should’ve been nothing. But it mattered.\n\nBecause for the first time in years, I felt awake.\n\n-\n\nHer POV – First Person\n\nI was late. Not fashionably late, not “oops the line at Starbucks was long” late. I was a full thirty minutes behind, and my stomach was in my throat the entire drive.\n\nThe dashboard clock mocked me—4:02 p.m.—and I sped into the school parking lot, brakes squealing. I grabbed my purse, bolted across the pavement, my heels clapping too loud against the sidewalk.\n\nThe after-school program lets out at 3:30. By 3:45, you’re already the bad parent. By 4:00? You’re practically the villain of the story.\n\nI pushed through the double doors, chest tight
