name: Package Pidgin Olelo

on:
  push:
    branches:
      - feature/pidgin-olelo-simplify-shell
    paths:
      - '.github/workflows/package-pidgin-olelo.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package pidgin-olelo folder
        run: zip -r pidgin-olelo-current.zip pidgin-olelo
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pidgin-olelo-current
          path: pidgin-olelo-current.zip
