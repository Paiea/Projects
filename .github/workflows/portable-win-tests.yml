name: Portable WIN tests

on:
  push:
    paths:
      - 'portable-win/**'
      - 'tests/test_portable_win_*.py'
      - '.github/workflows/portable-win-tests.yml'
  pull_request:
    paths:
      - 'portable-win/**'
      - 'tests/test_portable_win_*.py'
      - '.github/workflows/portable-win-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Teaching Menu contract
        run: python tests/test_portable_win_teaching_menu.py
      - name: Compiler Kernel contract
        run: python tests/test_portable_win_compiler_kernel.py
      - name: Facilitation Shell contract
        run: python tests/test_portable_win_facilitation_shell.py
      - name: Student Display contract
        run: python tests/test_portable_win_student_display.py
      - name: Prompt Quality contract
        run: python tests/test_portable_win_prompt_quality.py
      - name: Assessment Map contract
        run: python tests/test_portable_win_assessment_map.py
      - name: Assessment Browser contract
        run: python tests/test_portable_win_assessment_browser.py
      - name: Multi-Assessment contract
        run: python tests/test_portable_win_multi_assessment.py
