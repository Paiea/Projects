name: Project Hub Tests

on:
  push:
    paths:
      - 'index.html'
      - 'state/PROJECT_REGISTRY.md'
      - 'praxis/**'
      - 'hawaii-archive/**'
      - 'systems/image-os/**'
      - 'scripts/build_hawaii_image_assets.py'
      - 'scripts/run_image_os_v2_kaulia.py'
      - 'scripts/run_image_os_v2_kaulia_artistic.py'
      - 'tests/test_project_hub.py'
      - 'tests/test_hawaii_archive.py'
      - 'tests/test_hawaii_image_asset_states.py'
      - 'tests/test_image_os_v2.py'
      - '.github/workflows/project-hub-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'state/PROJECT_REGISTRY.md'
      - 'praxis/**'
      - 'hawaii-archive/**'
      - 'systems/image-os/**'
      - 'scripts/build_hawaii_image_assets.py'
      - 'scripts/run_image_os_v2_kaulia.py'
      - 'scripts/run_image_os_v2_kaulia_artistic.py'
      - 'tests/test_project_hub.py'
      - 'tests/test_hawaii_archive.py'
      - 'tests/test_hawaii_image_asset_states.py'
      - 'tests/test_image_os_v2.py'
      - '.github/workflows/project-hub-tests.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Kaulia Image OS v2 proof
        if: github.ref == 'refs/heads/feature/image-os-v2-pipeline' && github.actor != 'github-actions[bot]' && hashFiles('hawaii-archive/images/jobs/HAR-IMG-0001/v2-run.json') == ''
        run: |
          python -m pip install --disable-pip-version-check numpy opencv-python-headless onnxruntime
          python scripts/run_image_os_v2_kaulia.py
      - name: Commit Kaulia Image OS v2 proof
        if: github.ref == 'refs/heads/feature/image-os-v2-pipeline' && github.actor != 'github-actions[bot]' && hashFiles('hawaii-archive/images/jobs/HAR-IMG-0001/v2-run.json') == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            hawaii-archive/assets/images/HAR-IMG-0001/v2-restored.jpg \
            hawaii-archive/assets/images/HAR-IMG-0001/v2-color.jpg \
            hawaii-archive/images/jobs/HAR-IMG-0001/v2-run.json
          if ! git diff --cached --quiet; then
            git commit -m "build: generate Kaulia Image OS v2 proof"
            git push origin HEAD:feature/image-os-v2-pipeline
          fi
      - name: Generate Kaulia DDColor artistic candidate
        if: github.ref == 'refs/heads/feature/image-os-v2-pipeline' && github.actor != 'github-actions[bot]' && hashFiles('hawaii-archive/images/jobs/HAR-IMG-0001/v2-artistic-run.json') == ''
        run: |
          python -m pip install --disable-pip-version-check torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy opencv-python-headless pillow tqdm huggingface-hub
          python scripts/run_image_os_v2_kaulia_artistic.py
      - name: Commit Kaulia DDColor artistic candidate
        if: github.ref == 'refs/heads/feature/image-os-v2-pipeline' && github.actor != 'github-actions[bot]' && hashFiles('hawaii-archive/images/jobs/HAR-IMG-0001/v2-artistic-run.json') == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            hawaii-archive/assets/images/HAR-IMG-0001/v2-artistic-color.jpg \
            hawaii-archive/images/jobs/HAR-IMG-0001/v2-artistic-run.json
          if ! git diff --cached --quiet; then
            git commit -m "build: generate Kaulia DDColor artistic candidate"
            git push origin HEAD:feature/image-os-v2-pipeline
          fi
      - name: Verify project hub registration
        run: python tests/test_project_hub.py
      - name: Verify Hawaiʻi Archive Revival contracts
        run: python tests/test_hawaii_archive.py
      - name: Verify distinct Image OS media assets
        run: python tests/test_hawaii_image_asset_states.py
      - name: Verify Image OS v2 staged pipeline
        run: python tests/test_image_os_v2.py
      - name: Check Hawaiʻi Archive JavaScript syntax
        run: |
          node --check hawaii-archive/app.js
          node --check hawaii-archive/image-pilot.js
      - name: Upload Kaulia v2 review bundle
        if: github.ref == 'refs/heads/feature/image-os-v2-pipeline'
        uses: actions/upload-artifact@v4
        with:
          name: kaulia-v2-review
          path: |
            hawaii-archive/assets/images/HAR-IMG-0001/original.jpg
            hawaii-archive/assets/images/HAR-IMG-0001/v2-restored.jpg
            hawaii-archive/assets/images/HAR-IMG-0001/v2-color.jpg
            hawaii-archive/assets/images/HAR-IMG-0001/v2-artistic-color.jpg
            hawaii-archive/images/jobs/HAR-IMG-0001/v2-run.json
            hawaii-archive/images/jobs/HAR-IMG-0001/v2-artistic-run.json
