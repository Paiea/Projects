name: Project Hub Tests

on:
  push:
    paths:
      - 'index.html'
      - 'state/PROJECT_REGISTRY.md'
      - 'praxis/**'
      - 'hawaii-archive/**'
      - 'systems/image-os/**'
      - 'scripts/build_hawaii_image_assets.py'
      - 'scripts/materialize_hawaii_source_originals.py'
      - 'tests/test_project_hub.py'
      - 'tests/test_hawaii_archive.py'
      - 'tests/test_hawaii_archive_live_cache.py'
      - 'tests/test_hawaii_archive_june_window.py'
      - 'tests/test_hawaii_image_asset_states.py'
      - 'tests/test_hawaii_reconstructed_default.py'
      - 'tests/test_hawaii_image_source_originals.py'
      - '.github/workflows/project-hub-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'state/PROJECT_REGISTRY.md'
      - 'praxis/**'
      - 'hawaii-archive/**'
      - 'systems/image-os/**'
      - 'scripts/build_hawaii_image_assets.py'
      - 'scripts/materialize_hawaii_source_originals.py'
      - 'tests/test_project_hub.py'
      - 'tests/test_hawaii_archive.py'
      - 'tests/test_hawaii_archive_live_cache.py'
      - 'tests/test_hawaii_archive_june_window.py'
      - 'tests/test_hawaii_image_asset_states.py'
      - 'tests/test_hawaii_reconstructed_default.py'
      - 'tests/test_hawaii_image_source_originals.py'
      - '.github/workflows/project-hub-tests.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize corrected archival source pack
        if: github.ref == 'refs/heads/feature/hawaii-archive-source-originals'
        run: python scripts/materialize_hawaii_source_originals.py
      - name: Commit corrected archival source pack
        if: github.ref == 'refs/heads/feature/hawaii-archive-source-originals'
        run: |
          if git diff --quiet -- hawaii-archive/assets/images hawaii-archive/data/images/source-originals-002.json; then
            echo "Source pack already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hawaii-archive/assets/images/HAR-IMG-0011 \
                  hawaii-archive/assets/images/HAR-IMG-0012 \
                  hawaii-archive/assets/images/HAR-IMG-0013 \
                  hawaii-archive/assets/images/HAR-IMG-0014 \
                  hawaii-archive/assets/images/HAR-IMG-0015 \
                  hawaii-archive/assets/images/HAR-IMG-0016 \
                  hawaii-archive/assets/images/HAR-IMG-0017 \
                  hawaii-archive/assets/images/HAR-IMG-0018 \
                  hawaii-archive/data/images/source-originals-002.json
          git commit -m "assets: pair reconstructed views with archival originals"
          git push
      - name: Verify project hub registration
        run: python tests/test_project_hub.py
      - name: Verify Hawaiʻi Archive Revival contracts
        run: python tests/test_hawaii_archive.py
      - name: Verify Hawaiʻi Archive live-cache behavior
        run: python tests/test_hawaii_archive_live_cache.py
      - name: Verify Hawaiʻi Archive June crisis window
        run: python tests/test_hawaii_archive_june_window.py
      - name: Verify distinct Image OS media assets
        run: python tests/test_hawaii_image_asset_states.py
      - name: Verify reconstructed-first media behavior
        run: python tests/test_hawaii_reconstructed_default.py
      - name: Verify archival originals for reconstructed batch
        run: python tests/test_hawaii_image_source_originals.py
      - name: Check Hawaiʻi Archive JavaScript syntax
        run: |
          node --check hawaii-archive/app.js
          node --check hawaii-archive/image-pilot.js
