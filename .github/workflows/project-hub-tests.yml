name: Project Hub Tests

# Read-only verification. No workflow step mutates repository content.
on:
  push:
    paths:
      - 'index.html'
      - 'state/PROJECT_REGISTRY.md'
      - 'praxis/**'
      - 'portable-win/**'
      - 'hawaii-archive/**'
      - 'systems/image-os/**'
      - 'scripts/build_hawaii_image_assets.py'
      - 'tests/test_project_hub.py'
      - 'tests/test_portable_win_teaching_menu.py'
      - 'tests/test_hawaii_archive.py'
      - 'tests/test_hawaii_archive_live_cache.py'
      - 'tests/test_hawaii_archive_june_window.py'
      - 'tests/test_hawaii_archive_resource_links.py'
      - 'tests/test_hawaii_archive_artifact_receipts.py'
      - 'tests/test_hawaii_archive_source_density_002.py'
      - 'tests/test_hawaii_image_asset_states.py'
      - 'tests/test_hawaii_reconstructed_default.py'
      - 'tests/test_hawaii_archive_photo_posts_v2.py'
      - 'tests/test_hawaii_archive_visual_feed_batch.py'
      - 'tests/test_hawaii_archive_image_batch_003_live.py'
      - 'tests/test_hawaii_archive_public_image_curation.py'
      - '.github/workflows/project-hub-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'state/PROJECT_REGISTRY.md'
      - 'praxis/**'
      - 'portable-win/**'
      - 'hawaii-archive/**'
      - 'systems/image-os/**'
      - 'scripts/build_hawaii_image_assets.py'
      - 'tests/test_project_hub.py'
      - 'tests/test_portable_win_teaching_menu.py'
      - 'tests/test_hawaii_archive.py'
      - 'tests/test_hawaii_archive_live_cache.py'
      - 'tests/test_hawaii_archive_june_window.py'
      - 'tests/test_hawaii_archive_resource_links.py'
      - 'tests/test_hawaii_archive_artifact_receipts.py'
      - 'tests/test_hawaii_archive_source_density_002.py'
      - 'tests/test_hawaii_image_asset_states.py'
      - 'tests/test_hawaii_reconstructed_default.py'
      - 'tests/test_hawaii_archive_photo_posts_v2.py'
      - 'tests/test_hawaii_archive_visual_feed_batch.py'
      - 'tests/test_hawaii_archive_image_batch_003_live.py'
      - 'tests/test_hawaii_archive_public_image_curation.py'
      - '.github/workflows/project-hub-tests.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify project hub registration
        run: python tests/test_project_hub.py
      - name: Verify Portable WIN teaching menu
        run: |
          python tests/test_portable_win_teaching_menu.py
          node --check portable-win/teaching-menu.js
      - name: Verify Hawaiʻi Archive Revival contracts
        run: python tests/test_hawaii_archive.py
      - name: Verify Hawaiʻi Archive live-cache behavior
        run: python tests/test_hawaii_archive_live_cache.py
      - name: Verify Hawaiʻi Archive June crisis window
        run: python tests/test_hawaii_archive_june_window.py
      - name: Verify Hawaiʻi Archive deep resource links
        run: python tests/test_hawaii_archive_resource_links.py
      - name: Verify Hawaiʻi Archive artifact receipts
        run: python tests/test_hawaii_archive_artifact_receipts.py
      - name: Verify Hawaiʻi Archive source density batch 002
        run: python tests/test_hawaii_archive_source_density_002.py
      - name: Verify distinct Image OS media assets
        run: python tests/test_hawaii_image_asset_states.py
      - name: Verify reconstructed-first media behavior
        run: python tests/test_hawaii_reconstructed_default.py
      - name: Verify reconstructed-first photo posts
        run: python tests/test_hawaii_archive_photo_posts_v2.py
      - name: Verify layered visual feed batch
        run: python tests/test_hawaii_archive_visual_feed_batch.py
      - name: Verify live image batch 003 routing
        run: python tests/test_hawaii_archive_image_batch_003_live.py
      - name: Verify curated public image stacks
        run: python tests/test_hawaii_archive_public_image_curation.py
      - name: Check Hawaiʻi Archive JavaScript syntax
        run: |
          node --check hawaii-archive/app.js
          node --check hawaii-archive/image-pilot.js
