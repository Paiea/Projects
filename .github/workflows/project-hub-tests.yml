name: Project Hub Tests

on:
  push:
    paths:
      - 'index.html'
      - 'state/PROJECT_REGISTRY.md'
      - 'praxis/**'
      - 'hawaii-archive/**'
      - 'systems/image-os/**'
      - 'scripts/build_hawaii_image_assets.py'
      - 'scripts/materialize_hawaii_image_os_v2_live_assets.py'
      - '.image-os-staging/**'
      - 'tests/test_project_hub.py'
      - 'tests/test_hawaii_archive.py'
      - 'tests/test_hawaii_image_asset_states.py'
      - 'tests/test_hawaii_image_os_v2_live.py'
      - '.github/workflows/project-hub-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'state/PROJECT_REGISTRY.md'
      - 'praxis/**'
      - 'hawaii-archive/**'
      - 'systems/image-os/**'
      - 'scripts/build_hawaii_image_assets.py'
      - 'scripts/materialize_hawaii_image_os_v2_live_assets.py'
      - 'tests/test_project_hub.py'
      - 'tests/test_hawaii_archive.py'
      - 'tests/test_hawaii_image_asset_states.py'
      - 'tests/test_hawaii_image_os_v2_live.py'
      - '.github/workflows/project-hub-tests.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize staged Image OS v2 assets
        if: github.ref == 'refs/heads/feature/hawaii-archive-image-os-v2-live' && github.actor != 'github-actions[bot]' && hashFiles('.image-os-staging/READY') != ''
        run: python scripts/materialize_hawaii_image_os_v2_live_assets.py
      - name: Commit materialized Image OS v2 assets
        if: github.ref == 'refs/heads/feature/hawaii-archive-image-os-v2-live' && github.actor != 'github-actions[bot]' && hashFiles('.image-os-staging/READY') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hawaii-archive/assets/images/HAR-IMG-0001/reconstructed.jpg
          git add hawaii-archive/assets/images/HAR-IMG-0002/color-v2.jpg
          git add hawaii-archive/assets/images/HAR-IMG-0002/reconstructed.jpg
          git rm -r .image-os-staging
          git commit -m "build: materialize Image OS v2 live assets"
          git push origin HEAD:feature/hawaii-archive-image-os-v2-live
      - name: Verify project hub registration
        run: python tests/test_project_hub.py
      - name: Verify Hawaiʻi Archive Revival contracts
        run: python tests/test_hawaii_archive.py
      - name: Verify distinct Image OS media assets
        run: python tests/test_hawaii_image_asset_states.py
      - name: Verify Image OS v2 live media states
        run: python tests/test_hawaii_image_os_v2_live.py
      - name: Check Hawaiʻi Archive JavaScript syntax
        run: |
          node --check hawaii-archive/app.js
          node --check hawaii-archive/image-pilot.js
