name: Project Hub Tests

on:
  push:
    paths:
      - 'index.html'
      - 'state/PROJECT_REGISTRY.md'
      - 'praxis/**'
      - 'hawaii-archive/**'
      - 'systems/image-os/**'
      - 'scripts/build_hawaii_image_assets.py'
      - 'tests/test_project_hub.py'
      - 'tests/test_hawaii_archive.py'
      - 'tests/test_hawaii_image_asset_states.py'
      - '.github/workflows/project-hub-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'state/PROJECT_REGISTRY.md'
      - 'praxis/**'
      - 'hawaii-archive/**'
      - 'systems/image-os/**'
      - 'scripts/build_hawaii_image_assets.py'
      - 'tests/test_project_hub.py'
      - 'tests/test_hawaii_archive.py'
      - 'tests/test_hawaii_image_asset_states.py'
      - '.github/workflows/project-hub-tests.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate bugfix image assets
        if: github.ref == 'refs/heads/fix/image-os-real-state-assets'
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/build_hawaii_image_assets.py
      - name: Commit bugfix image assets
        if: github.ref == 'refs/heads/fix/image-os-real-state-assets'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hawaii-archive/assets/images
          if ! git diff --cached --quiet; then
            git commit -m "build: generate distinct Image OS state assets"
            git push origin HEAD:fix/image-os-real-state-assets
          fi
      - name: Verify project hub registration
        run: python tests/test_project_hub.py
      - name: Verify Hawaiʻi Archive Revival contracts
        run: python tests/test_hawaii_archive.py
      - name: Verify distinct Image OS media assets
        run: python tests/test_hawaii_image_asset_states.py
      - name: Check Hawaiʻi Archive JavaScript syntax
        run: |
          node --check hawaii-archive/app.js
          node --check hawaii-archive/image-pilot.js
