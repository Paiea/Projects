name: Build Hawaiʻi Image Assets

on:
  push:
    branches:
      - fix/image-os-real-state-assets
    paths:
      - 'scripts/build_hawaii_image_assets.py'
      - 'hawaii-archive/data/images/index.json'
      - '.github/workflows/build-hawaii-image-assets.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/image-os-real-state-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate archival image derivatives
        run: python scripts/build_hawaii_image_assets.py
      - name: Commit generated image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hawaii-archive/assets/images
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "build: generate distinct Image OS state assets"
          git push origin HEAD:fix/image-os-real-state-assets
