<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Text-first Light Reader for Paiea story projects.">
  <title>Light Reader · Paiea Stories</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="reader-shell">
    <nav class="reader-nav" aria-label="Reader navigation">
      <a href="../">Stories</a>
      <a href="../../">Projects</a>
    </nav>
    <header class="reader-header">
      <p id="status" class="status"></p>
      <h1 id="title">Light Reader</h1>
      <p id="subtitle" class="subtitle"></p>
    </header>
    <article id="content" class="reader-content" aria-live="polite"></article>
    <section id="error" class="reader-error" hidden></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
